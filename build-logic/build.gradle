plugins {
    id 'groovy-gradle-plugin'
}

repositories {
    mavenCentral()
    gradlePluginPortal()
}

dependencies {
    implementation 'com.diffplug.spotless:spotless-plugin-gradle:8.12.0'
    implementation 'net.ltgt.gradle:gradle-errorprone-plugin:5.2.0'
    compileOnly 'com.uber.nullaway:nullaway:0.14.4'
    // These tools also use Guava and JSON at runtime; compileOnly cannot upgrade that graph.
    implementation 'com.google.guava:guava:33.8.0-jre'
    implementation 'org.json:json:20260814'
    compileOnly 'org.jspecify:jspecify:1.0.1'
    // Streaming JSON preserves duplicate-key rejection in candidate records.
    implementation 'com.google.code.gson:gson:2.15.0'
    implementation 'com.guardsquare:proguard-gradle:7.10.0'
    implementation 'com.guardsquare:proguard-retrace:7.10.0'
    // Pin the compressor as well as ZIP metadata; native zlib differs between JDKs.
    implementation 'com.jcraft:jzlib:1.1.3'
    implementation 'org.apache.commons:commons-compress:1.28.0'
    implementation 'org.cyclonedx:cyclonedx-gradle-plugin:3.6.1'
    implementation platform('com.fasterxml.jackson:jackson-bom:2.23.0')
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

gradlePlugin {
    plugins {
        quality {
            id = 'cbbg.quality'
            implementationClass = 'cbbg.gradle.QualityPlugin'
        }
        formatting {
            id = 'cbbg.formatting'
            implementationClass = 'cbbg.gradle.FormattingPlugin'
        }
        targets {
            id = 'cbbg.targets'
            implementationClass = 'cbbg.gradle.TargetsPlugin'
        }
        packaging {
            id = 'cbbg.packaging'
            implementationClass = 'cbbg.gradle.PackagingPlugin'
        }
        utilities {
            id = 'cbbg.utilities'
            implementationClass = 'cbbg.gradle.UtilitiesPlugin'
        }
        releaseSbom {
            id = 'cbbg.release-sbom'
            implementationClass = 'cbbg.gradle.ReleaseSbomPlugin'
        }
        privateGson {
            id = 'cbbg.private-gson'
            implementationClass = 'cbbg.gradle.PrivateGsonPlugin'
        }
        release {
            id = 'cbbg.release'
            implementationClass = 'cbbg.gradle.ReleasePlugin'
        }
    }
}

test {
    useJUnitPlatform()
    testLogging { exceptionFormat = 'full' }
    systemProperty 'cbbg.repository', projectDir.parentFile.absolutePath
    maxParallelForks = 1
}
