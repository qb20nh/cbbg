plugins {
    id 'cbbg.targets'
    id 'cbbg.release'
    id 'cbbg.formatting'
}

repositories { mavenCentral() }

['check', 'ciCheck', 'qualityCheck'].each { operation ->
    tasks.named(operation) { dependsOn tasks.named('spotlessCheck') }
}

tasks.named('check') {
    dependsOn gradle.includedBuild('build-logic').task(':check')
}

// Child builds also include build-logic; finish its tests before they compile it.
tasks.withType(cbbg.gradle.TargetBuild).configureEach {
    dependsOn gradle.includedBuild('build-logic').task(':check')
}
