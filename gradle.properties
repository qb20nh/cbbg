# Performance tuning (local builds)
# - Build cache: reuses outputs across incremental builds
# - Parallel execution: runs independent tasks concurrently
# - VFS watching: speeds up incremental builds by avoiding full file scans
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.vfs.watch=true

# Done to increase the memory available to Gradle (Fabric Loom can be memory-hungry).
org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.2
loader_version=0.19.5
loom_version=1.17.21

# Mod Properties
mod_version=1.3.0
maven_group=com.qb20nh.cbbg
archives_base_name=cbbg

# Publishing (non-secret project IDs)
modrinth_project_id=UBlXUQbC
curseforge_project_id=1408371

# Dependencies
fabric_api_version=0.160.0+26.2
modmenu_version=20.0.1
