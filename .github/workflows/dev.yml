name: Build Dev JAR

on:
  workflow_dispatch:
    inputs:
      targets:
        description: Comma-separated target IDs; empty uses the catalog CI selection
        required: false
        type: string

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up build Java 25
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6.4.0
      - name: Select catalog targets
        id: targets
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          args=()
          if [[ -n "$TARGETS" ]]; then args+=("-Ptargets=$TARGETS"); fi
          ./gradlew --no-daemon "${args[@]}" -Poutput=build/dev-matrix.json targetMatrix
          printf 'matrix=%s\n' "$(cat build/dev-matrix.json)" >> "$GITHUB_OUTPUT"

  dev:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up target Java ${{ matrix.java }}
        uses: actions/setup-java@v6.0.1
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
      - name: Set up build Java 25
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-cleanup: on-success
      - name: Check and build development jars
        env:
          TARGET_ID: ${{ matrix.id }}
        run: ./gradlew --no-daemon --build-cache "-Ptarget=$TARGET_ID" ciCheck dev
      - uses: actions/upload-artifact@v7
        with:
          name: dev-${{ matrix.id }}
          path: ${{ matrix.buildProfile == 'fabric-upstream' && 'build/libs/*-dev-*.jar' || format('build/targets/{0}/dev/*.jar', matrix.id) }}
          if-no-files-found: error
