name: Build Dev JAR

on:
  workflow_dispatch:
    inputs:
      targets:
        description: Comma-separated target IDs; empty uses the catalog CI selection
        required: false
        type: string

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6.0.1
      - name: Select catalog targets
        id: targets
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          if [[ -n "$TARGETS" ]]; then
            matrix=$(python3 scripts/targets.py --artifacts --targets "$TARGETS")
          else
            matrix=$(python3 scripts/targets.py --artifacts --ci)
          fi
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  dev:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6.0.1
      - uses: actions/setup-java@v5.1.0
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v5.0.0
        with:
          cache-cleanup: on-success
      - name: Check and build development jars
        env:
          TARGET_ID: ${{ matrix.id }}
        run: |
          python3 scripts/build_targets.py ciCheck --targets "$TARGET_ID"
          python3 scripts/build_targets.py dev --targets "$TARGET_ID"
      - uses: actions/upload-artifact@v6
        with:
          name: dev-${{ matrix.id }}
          path: build/targets/${{ matrix.id }}/dev/*.jar
          if-no-files-found: error
