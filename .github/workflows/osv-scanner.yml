name: OSV-Scanner

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  schedule:
    - cron: '22 13 * * 4'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  osv-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout proposed code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: current
          persist-credentials: false
      - name: Checkout comparison base
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          path: baseline
          persist-credentials: false
      - name: Set up dependency resolution Java 25
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6.3.0
      - name: Resolve Gradle dependencies
        id: dependencies
        shell: bash
        run: |
          set -euo pipefail
          error() {
            local message="${1//%/%25}"
            message="${message//$'\r'/%0D}"
            message="${message//$'\n'/%0A}"
            printf '::error::%s\n' "$message"
          }
          init="$GITHUB_WORKSPACE/current/gradle/dependency-sbom.init.gradle"
          generate() {
            local checkout="$GITHUB_WORKSPACE/$1" output="$GITHUB_WORKSPACE/.osv/$1"
            mkdir -p "$output"
            for build in . core build-logic build-config/publishing build-config/fabric-upstream; do
              if [[ -f "$checkout/$build/settings.gradle" ]]; then
                local label="${build//\//-}"
                [[ "$build" != . ]] || label=root
                if ! "$checkout/gradlew" -p "$checkout/$build" --init-script "$init" \
                  cyclonedxBom "-PsecuritySbom=$output/$label.cdx.json" --no-daemon; then
                  error "Could not generate $output/$label.cdx.json for $checkout/$build. See the Gradle failure above; OSV needs resolved dependencies before scanning."
                  exit 1
                fi
              fi
            done
            if [[ -f "$checkout/targets.json" ]]; then
              if ! jq -er '.ciTargets[] as $id | .targets[] | select(.id == $id) | [.id, .buildProfile] | @tsv' \
                "$checkout/targets.json" > "$output/targets.tsv"; then
                error "Could not select OSV targets from $checkout/targets.json. Check that ciTargets selects catalog entries with buildProfile values."
                exit 1
              fi
              while IFS=$'\t' read -r target profile; do
                if [[ ! "$target" =~ ^[a-zA-Z0-9._-]+$ || ! "$profile" =~ ^[a-zA-Z0-9_-]+$ ]]; then
                  error "Invalid OSV target '$target' or build profile '$profile' in $checkout/targets.json. Use target IDs containing letters, digits, dots, underscores or hyphens; build profiles allow letters, digits, underscores or hyphens."
                  exit 1
                fi
                if ! "$checkout/gradlew" -p "$checkout/build-config/$profile" "-Ptarget=$target" \
                  --init-script "$init" cyclonedxBom "-PsecuritySbom=$output/$target.cdx.json" --no-daemon; then
                  error "Could not generate $output/$target.cdx.json for target $target (profile $profile). See the Gradle failure above; OSV needs resolved dependencies before scanning."
                  exit 1
                fi
              done < "$output/targets.tsv"
            fi
            local sboms=("$output"/*.cdx.json)
            if ! jq -e --slurp 'all(.[]; .bomFormat == "CycloneDX") and
              ([.[] | .components[]? | select((.purl // "") | startswith("pkg:maven/"))] | length > 0)' \
              "${sboms[@]}"; then
              error "Dependency reports in $output must be valid CycloneDX JSON with at least one Maven component across the reports. Check the cyclonedxBom output above and the osv-dependencies artifact."
              exit 1
            fi
            {
              echo "$1-args<<SBOM_ARGS"
              for sbom in "${sboms[@]}"; do echo "--sbom=${sbom#"$GITHUB_WORKSPACE/"}"; done
              echo SBOM_ARGS
            } >> "$GITHUB_OUTPUT"
          }
          generate current
          if [[ -d baseline ]]; then generate baseline; fi
      - name: Scan base dependencies
        if: steps.dependencies.outputs.baseline-args != ''
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --format=json
            --output=old-results.json
            ${{ steps.dependencies.outputs.baseline-args }}
      - name: Scan proposed dependencies
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --format=json
            --output=new-results.json
            ${{ steps.dependencies.outputs.current-args }}
      - name: Require completed scans
        shell: bash
        env:
          COMPARE: ${{ steps.dependencies.outputs.baseline-args != '' }}
        run: |
          set -euo pipefail
          if ! jq -e '.results | type == "array"' new-results.json; then
            echo "::error::new-results.json is missing, invalid JSON, or has no results array. Inspect Scan proposed dependencies and the osv-dependencies artifact; scan results are required even when no vulnerabilities are found."
            exit 1
          fi
          if [[ "$COMPARE" == true ]]; then
            if ! jq -e '.results | type == "array"' old-results.json; then
              echo "::error::old-results.json is missing, invalid JSON, or has no results array. Inspect Scan base dependencies and the osv-dependencies artifact; PR comparisons require both scans."
              exit 1
            fi
          fi
      - name: Report vulnerabilities
        uses: google/osv-scanner-action/osv-reporter-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --output-files=sarif:results.sarif
            --output-files=gh-annotations:#stderr
            --fail-on-vuln=true
            ${{ steps.dependencies.outputs.baseline-args != '' && '--old=old-results.json' || '' }}
            --new=new-results.json
      - name: Upload scan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: osv-dependencies
          path: |
            .osv/**/*.cdx.json
            old-results.json
            new-results.json
            results.sarif
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Upload to code scanning
        if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
