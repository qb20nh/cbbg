name: Java CI with Gradle

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  selection:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.batch.outputs.matrix || steps.targets.outputs.matrix }}
      build: ${{ steps.batch.outputs.build || steps.targets.outputs.build }}
      core: ${{ steps.batch.outputs.core || steps.targets.outputs.core }}
      tooling: ${{ steps.batch.outputs.tooling || steps.targets.outputs.tooling }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up build Java 25
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6.3.0
      - name: Select catalog targets
        id: targets
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          mkdir -p build
          ./gradlew --no-daemon "-Pbase=$BASE_COMMIT" \
            -Poutput=build/change-impact.json "-PgithubOutput=$GITHUB_OUTPUT" selectChecks
      - name: Select full batch CI
        id: batch
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'automation/dependabot-major-batch/')
        run: |
          targets="$(jq -er '.ciTargets | select(length > 0) | join(",")' targets.json)"
          ./gradlew --no-daemon "-Ptargets=$targets" \
            -Poutput=build/batch-matrix.json targetMatrix
          if ! jq -e '.include | length > 0' build/batch-matrix.json; then
            echo "::error::build/batch-matrix.json is missing, invalid, or empty. Check the targetMatrix output above and the ciTargets selection in targets.json before retrying full batch CI."
            exit 1
          fi
          printf 'matrix=%s\nbuild=true\ncore=true\ntooling=true\n' \
            "$(jq -c . build/batch-matrix.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: change-impact
          path: build/change-impact.json
  tooling:
    needs: selection
    if: needs.selection.outputs.tooling == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up build Java 25
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6.3.0
      - name: Check Java formatting
        run: ./gradlew --no-daemon spotlessCheck
      - name: Test build and release tooling
        run: |
          ./gradlew -p build-logic --no-daemon --build-cache test
          python3 -m pip install --disable-pip-version-check -r .github/scripts/requirements.txt
          python3 -m unittest discover -s scripts/tests
          python3 -m unittest discover -s .github/tests

  plan:
    needs: [selection, tooling]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify selection and tooling
        env:
          SELECTION_RESULT: ${{ needs.selection.result }}
          TOOLING_RESULT: ${{ needs.tooling.result }}
          TOOLING_REQUIRED: ${{ needs.selection.outputs.tooling }}
        run: |
          if [[ "$SELECTION_RESULT" != success ]]; then
            echo "Target selection did not succeed: $SELECTION_RESULT"
            exit 1
          fi
          case "$TOOLING_REQUIRED:$TOOLING_RESULT" in
            true:success|false:success|false:skipped) ;;
            *) echo "Tooling did not satisfy the selection: $TOOLING_REQUIRED:$TOOLING_RESULT"; exit 1 ;;
          esac

  core:
    needs: selection
    if: needs.selection.outputs.core == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [8, 17, 21, 25]
    steps:
      - uses: actions/checkout@v7
      - name: Set up test runtime Java ${{ matrix.java }}
        id: test-java
        uses: actions/setup-java@v6.0.1
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
      - name: Set up build Java 25
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6.3.0
      - name: Test core on selected runtime
        if: matrix.java != 25
        env:
          TEST_JAVA: ${{ matrix.java }}
          TEST_JAVA_HOME: ${{ steps.test-java.outputs.path }}
        run: >-
          ./gradlew -p core test --no-daemon --build-cache
          "-PtestJava=$TEST_JAVA"
          "-Dorg.gradle.java.installations.paths=$TEST_JAVA_HOME"
      - name: Check core quality
        if: matrix.java == 25
        env:
          TEST_JAVA: ${{ matrix.java }}
          TEST_JAVA_HOME: ${{ steps.test-java.outputs.path }}
        run: >-
          ./gradlew -p core --no-daemon --build-cache check
          "-PtestJava=$TEST_JAVA"
          "-Dorg.gradle.java.installations.paths=$TEST_JAVA_HOME"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: core-checks-java-${{ matrix.java }}
          path: |
            core/build/reports/
            core/*/build/reports/

  build:
    needs: selection
    if: needs.selection.outputs.build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.selection.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up target Java ${{ matrix.java }}
        uses: actions/setup-java@v6.0.1
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
      - name: Set up build Java 25
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-cleanup: on-success
      - name: Compile and check target packages
        env:
          TARGET_ID: ${{ matrix.id }}
        run: ./gradlew --no-daemon --build-cache "-Ptarget=$TARGET_ID" ciCheck
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: checks-${{ matrix.id }}
          path: |
            build/targets/${{ matrix.id }}/reports/
            build/reports/
            core/build/reports/
            core/*/build/reports/

  dependency-submission:
    if: github.event_name == 'push' && needs.selection.outputs.build == 'true'
    needs: selection
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.selection.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up target Java ${{ matrix.java }}
        uses: actions/setup-java@v6.0.1
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
      - name: Set up build Java 25
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '25'
          distribution: temurin
      - name: Generate and submit target dependency graph
        uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          build-root-directory: .
          additional-arguments: >-
            -p build-config/${{ matrix.buildProfile }} -Ptarget=${{ matrix.id }}
            --init-script ${{ github.workspace }}/gradle/dependency-sbom.init.gradle
          dependency-graph-exclude-configurations: >-
            ^(minecraft|minecraftClientLibraries|minecraftClientRuntimeLibraries|minecraftServerLibraries|minecraftServerRuntimeLibraries|minecraftNatives)$
