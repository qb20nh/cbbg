name: Java CI with Gradle

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6.0.1
      - name: Select catalog targets
        id: targets
        run: |
          matrix=$(python3 scripts/targets.py --ci --artifacts)
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
      - name: Test build and release tooling
        run: |
          python3 -m unittest discover -s scripts/tests
          python3 -m unittest discover -s .github/tests

  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [8, 17, 21, 25]
    steps:
      - uses: actions/checkout@v6.0.1
      - name: Install test runtime
        id: test-java
        uses: actions/setup-java@v5.1.0
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
      - name: Install build JDK
        uses: actions/setup-java@v5.1.0
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v5.0.0
      - name: Test core on selected runtime
        env:
          TEST_JAVA: ${{ matrix.java }}
          TEST_JAVA_HOME: ${{ steps.test-java.outputs.path }}
        run: >-
          ./gradlew -p core test --no-daemon
          "-PtestJava=$TEST_JAVA"
          "-Dorg.gradle.java.installations.paths=$TEST_JAVA_HOME"

  build:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6.0.1
      - uses: actions/setup-java@v5.1.0
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v5.0.0
        with:
          cache-cleanup: on-success
      - name: Compile and check target packages
        env:
          TARGET_ID: ${{ matrix.id }}
        run: python3 scripts/build_targets.py ciCheck --targets "$TARGET_ID"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: checks-${{ matrix.id }}
          path: |
            build/targets/${{ matrix.id }}/reports/
            core/build/reports/tests/

  dependency-submission:
    if: github.event_name == 'push'
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6.0.1
      - uses: actions/setup-java@v5.1.0
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
      - name: Generate and submit target dependency graph
        uses: gradle/actions/dependency-submission@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
        with:
          build-root-directory: .
          additional-arguments: -p build-config/${{ matrix.buildProfile }} -Ptarget=${{ matrix.id }}
