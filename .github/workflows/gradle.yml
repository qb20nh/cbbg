name: Java CI with Gradle

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      build: ${{ steps.targets.outputs.build }}
      core: ${{ steps.targets.outputs.core }}
    steps:
      - uses: actions/checkout@v6.0.1
        with:
          fetch-depth: 0
      - name: Set up build Java 25
        uses: actions/setup-java@v5.1.0
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v5.0.0
      - name: Check Java formatting
        run: ./gradlew --no-daemon spotlessCheck
      - name: Select catalog targets
        id: targets
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          mkdir -p build
          ./gradlew --no-daemon "-Pbase=$BASE_COMMIT" \
            -Poutput=build/change-impact.json "-PgithubOutput=$GITHUB_OUTPUT" selectChecks
      - uses: actions/upload-artifact@v6
        with:
          name: change-impact
          path: build/change-impact.json
      - name: Test build and release tooling
        run: |
          ./gradlew -p build-logic --no-daemon test
          python3 -m unittest discover -s scripts/tests
          python3 -m unittest discover -s .github/tests

  core:
    needs: plan
    if: needs.plan.outputs.core == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [8, 17, 21, 25]
    steps:
      - uses: actions/checkout@v6.0.1
      - name: Set up test runtime Java ${{ matrix.java }}
        id: test-java
        uses: actions/setup-java@v5.1.0
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
      - name: Set up build Java 25
        uses: actions/setup-java@v5.1.0
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v5.0.0
      - name: Test core on selected runtime
        env:
          TEST_JAVA: ${{ matrix.java }}
          TEST_JAVA_HOME: ${{ steps.test-java.outputs.path }}
        run: >-
          ./gradlew -p core test --no-daemon
          "-PtestJava=$TEST_JAVA"
          "-Dorg.gradle.java.installations.paths=$TEST_JAVA_HOME"
      - name: Check core quality
        if: matrix.java == 25
        run: ./gradlew -p core --no-daemon check
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: core-checks-java-${{ matrix.java }}
          path: |
            core/build/reports/
            core/*/build/reports/

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6.0.1
      - name: Set up target Java ${{ matrix.java }}
        uses: actions/setup-java@v5.1.0
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
      - name: Set up build Java 25
        uses: actions/setup-java@v5.1.0
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v5.0.0
        with:
          cache-cleanup: on-success
      - name: Compile and check target packages
        env:
          TARGET_ID: ${{ matrix.id }}
        run: ./gradlew --no-daemon "-Ptarget=$TARGET_ID" ciCheck
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: checks-${{ matrix.id }}
          path: |
            build/targets/${{ matrix.id }}/reports/
            build/reports/
            core/build/reports/
            core/*/build/reports/

  dependency-submission:
    if: github.event_name == 'push' && needs.plan.outputs.build == 'true'
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6.0.1
      - name: Set up target Java ${{ matrix.java }}
        uses: actions/setup-java@v5.1.0
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
      - name: Set up build Java 25
        uses: actions/setup-java@v5.1.0
        with:
          java-version: '25'
          distribution: temurin
      - name: Generate and submit target dependency graph
        uses: gradle/actions/dependency-submission@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
        with:
          build-root-directory: .
          additional-arguments: -p build-config/${{ matrix.buildProfile }} -Ptarget=${{ matrix.id }}
