name: Publish (GitHub Release)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (draft candidates allowed only for dry runs; historical vX.Y.Z+mcVERSION)"
        required: true
        type: string
      dry_run:
        description: "Validate release files and destination labels without uploading"
        required: true
        default: true
        type: boolean
      services:
        description: "Upload destinations; check CurseForge files before retrying an upload"
        required: true
        default: both
        type: choice
        options:
          - both
          - modrinth
          - curseforge

permissions:
  contents: read
  actions: read
  attestations: read

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: "build and publish"
    outputs:
      matrix: ${{ steps.publication.outputs.matrix }}
    steps:
      - name: Require a new dispatch for CurseForge retries
        if: ${{ !inputs.dry_run && inputs.services != 'modrinth' && github.run_attempt != '1' }}
        run: |
          echo "Check the CurseForge project files, then start a new dispatch for the intended service."
          exit 1

      - name: Checkout publishing tools
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          path: .release-source
          persist-credentials: false

      - name: Set up build Java 25
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v5.0.0

      - name: Prepare publication
        id: publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          SERVICES: ${{ inputs.services }}
          DRY_RUN: ${{ inputs.dry_run }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          mkdir -p build
          ./gradlew --no-daemon "-Prelease=$RELEASE_TAG" "-Prepo=$GH_REPO" \
            -PsourceRoot=.release-source -Passets=release-assets \
            -Poutput=build/publication.json "-PgithubOutput=$GITHUB_OUTPUT" \
            "-Pservices=$SERVICES" "-PdryRun=$DRY_RUN" preparePublication

      - name: Check all Modrinth retry plans
        if: inputs.services != 'curseforge'
        run: |
          python3 -c 'import json; records=json.load(open("build/publication.json"))["records"]; assert records; print("\n".join(r["targets"][0] for r in records))' > build/publication-targets.txt
          mapfile -t targets < build/publication-targets.txt
          for target in "${targets[@]}"; do
            args=(--no-daemon -p build-config/publishing
              "-PpublicationMetadata=$PWD/build/publication.json"
              "-PsourceRoot=$PWD/.release-source" "-Ptarget=$target")
            if jq -e '.legacy == true' build/publication.json >/dev/null; then
              args+=("-PlegacyAssets=$PWD/release-assets")
            else
              args+=("-Pcandidate=$PWD/release-assets/candidate.json")
            fi
            ./gradlew "${args[@]}" planModrinthUpload
          done

  publish:
    needs: preflight
    runs-on: ubuntu-latest
    environment: "build and publish"
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    steps:
      - name: Require a new dispatch for CurseForge retries
        if: ${{ !inputs.dry_run && inputs.services != 'modrinth' && github.run_attempt != '1' }}
        run: |
          echo "Check the CurseForge project files, then start a new dispatch for the intended service."
          exit 1

      - name: Checkout publishing tools
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          path: .release-source
          persist-credentials: false

      - name: Set up build Java 25
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v5.0.0

      - name: Recheck publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          SERVICES: ${{ inputs.services }}
          DRY_RUN: ${{ inputs.dry_run }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          mkdir -p build
          ./gradlew --no-daemon "-Prelease=$RELEASE_TAG" "-Prepo=$GH_REPO" \
            -PsourceRoot=.release-source -Passets=release-assets \
            -Poutput=build/publication.json "-PgithubOutput=$GITHUB_OUTPUT" \
            "-Pservices=$SERVICES" "-PdryRun=$DRY_RUN" preparePublication

      - name: Select checked publication record
        id: publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          SERVICES: ${{ inputs.services }}
          TARGET_ID: ${{ matrix.target }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          ./gradlew --no-daemon "-Prelease=$RELEASE_TAG" "-Prepo=$GH_REPO" \
            -PsourceRoot=.release-source -Passets=release-assets \
            -PpublicationMetadata=build/publication.json "-Ptarget=$TARGET_ID" \
            "-PgithubOutput=$GITHUB_OUTPUT" "-Pservices=$SERVICES" selectPublication

      - name: Validate or publish to Modrinth
        if: inputs.services != 'curseforge'
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          TARGET_ID: ${{ steps.publication.outputs.target }}
        run: |
          args=(--no-daemon -p build-config/publishing
            "-PpublicationMetadata=$PWD/build/publication.json"
            "-PsourceRoot=$PWD/.release-source" "-Ptarget=$TARGET_ID")
          if jq -e '.legacy == true' build/publication.json >/dev/null; then
            args+=("-PlegacyAssets=$PWD/release-assets")
          else
            args+=("-Pcandidate=$PWD/release-assets/candidate.json")
          fi
          if [[ "$DRY_RUN" == "true" ]]; then
            task=planModrinthUpload
          else
            if [[ -z "$MODRINTH_TOKEN" ]]; then
              echo "Missing MODRINTH_TOKEN for upload."
              exit 1
            fi
            task=modrinth
          fi
          ./gradlew "${args[@]}" "$task"

      - name: Upload to CurseForge
        if: ${{ !inputs.dry_run && inputs.services != 'modrinth' }}
        id: curseforge_upload
        uses: itsmeow/curseforge-upload@v3.1.2
        with:
          token: ${{ secrets.CF_API_TOKEN }}
          project_id: ${{ steps.publication.outputs.cf_project_id }}
          game_endpoint: minecraft
          relations: ${{ steps.publication.outputs.cf_relations }}
          file_path: ${{ steps.publication.outputs.artifact }}
          game_versions: ${{ steps.publication.outputs.cf_game_versions }}
          release_type: ${{ steps.publication.outputs.cf_release_type }}
          display_name: ${{ steps.publication.outputs.cf_display_name }}
          changelog: ${{ steps.publication.outputs.cf_changelog }}
          changelog_type: markdown

      - name: Save CurseForge upload record
        if: ${{ !inputs.dry_run && inputs.services != 'modrinth' }}
        env:
          CF_FILE_ID: ${{ steps.curseforge_upload.outputs.id }}
          TARGET_ID: ${{ matrix.target }}
        run: |
          ./gradlew --no-daemon "-PpublicationMetadata=build/publication.json" \
            "-Ptarget=$TARGET_ID" "-PfileId=$CF_FILE_ID" -Poutput=build/curseforge-result.json recordCurseForgeUpload

      - name: Upload sources and mappings to CurseForge
        if: ${{ !inputs.dry_run && inputs.services != 'modrinth' }}
        id: curseforge_sources_upload
        uses: itsmeow/curseforge-upload@v3.1.2
        with:
          token: ${{ secrets.CF_API_TOKEN }}
          project_id: ${{ steps.publication.outputs.cf_project_id }}
          game_endpoint: minecraft
          parent_file_id: ${{ steps.curseforge_upload.outputs.id }}
          file_path: ${{ steps.publication.outputs.sources }}
          release_type: ${{ steps.publication.outputs.cf_release_type }}
          display_name: ${{ steps.publication.outputs.cf_display_name }} sources
          changelog: ${{ steps.publication.outputs.cf_changelog }}
          changelog_type: markdown

      - name: Save CurseForge sources upload record
        if: ${{ !inputs.dry_run && inputs.services != 'modrinth' }}
        env:
          CF_FILE_ID: ${{ steps.curseforge_upload.outputs.id }}
          CF_SOURCES_FILE_ID: ${{ steps.curseforge_sources_upload.outputs.id }}
          TARGET_ID: ${{ matrix.target }}
        run: |
          ./gradlew --no-daemon "-PpublicationMetadata=build/publication.json" \
            "-Ptarget=$TARGET_ID" "-PfileId=$CF_FILE_ID" "-PsourcesFileId=$CF_SOURCES_FILE_ID" \
            -Poutput=build/curseforge-sources-result.json recordCurseForgeUpload

      - name: Upload SBOM and provenance to CurseForge
        if: ${{ !inputs.dry_run && inputs.services != 'modrinth' && steps.publication.outputs.evidence != '' }}
        id: curseforge_evidence_upload
        uses: itsmeow/curseforge-upload@v3.1.2
        with:
          token: ${{ secrets.CF_API_TOKEN }}
          project_id: ${{ steps.publication.outputs.cf_project_id }}
          game_endpoint: minecraft
          parent_file_id: ${{ steps.curseforge_upload.outputs.id }}
          file_path: ${{ steps.publication.outputs.evidence }}
          release_type: ${{ steps.publication.outputs.cf_release_type }}
          display_name: ${{ steps.publication.outputs.cf_display_name }} build evidence
          changelog: ${{ steps.publication.outputs.cf_changelog }}
          changelog_type: markdown

      - name: Save CurseForge evidence upload record
        if: ${{ !inputs.dry_run && inputs.services != 'modrinth' && steps.publication.outputs.evidence != '' }}
        env:
          CF_FILE_ID: ${{ steps.curseforge_upload.outputs.id }}
          CF_SOURCES_FILE_ID: ${{ steps.curseforge_sources_upload.outputs.id }}
          CF_EVIDENCE_FILE_ID: ${{ steps.curseforge_evidence_upload.outputs.id }}
          TARGET_ID: ${{ matrix.target }}
        run: |
          ./gradlew --no-daemon "-PpublicationMetadata=build/publication.json" \
            "-Ptarget=$TARGET_ID" "-PfileId=$CF_FILE_ID" "-PsourcesFileId=$CF_SOURCES_FILE_ID" \
            "-PevidenceFileId=$CF_EVIDENCE_FILE_ID" \
            -Poutput=build/curseforge-evidence-result.json recordCurseForgeUpload

      - name: Save publication records
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: publication-${{ inputs.tag }}-${{ inputs.services }}-${{ matrix.target }}
          path: |
            build/publication.json
            build/curseforge-result.json
            build/curseforge-sources-result.json
            build/curseforge-evidence-result.json
            build/publishing/**/modrinth-plan.json
            build/publishing/**/modrinth-result.json
