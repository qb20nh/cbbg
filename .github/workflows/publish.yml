name: Publish (GitHub Release)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing immutable release tag (vX.Y.Z or historical vX.Y.Z+mcVERSION)"
        required: true
        type: string
      dry_run:
        description: "Validate release files and destination labels without uploading"
        required: true
        default: true
        type: boolean
      services:
        description: "Upload destinations; check CurseForge files before retrying an upload"
        required: true
        default: both
        type: choice
        options:
          - both
          - modrinth
          - curseforge

permissions:
  contents: read
  attestations: read

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: "build and publish"
    steps:
      - name: Require a new dispatch for CurseForge retries
        if: ${{ !inputs.dry_run && inputs.services != 'modrinth' && github.run_attempt != '1' }}
        run: |
          echo "Check the CurseForge project files, then start a new dispatch for the intended service."
          exit 1

      - name: Checkout publishing tools
        uses: actions/checkout@v6.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Checkout release source
        uses: actions/checkout@v6.0.1
        with:
          ref: ${{ inputs.tag }}
          path: .release-source
          persist-credentials: false

      - uses: actions/setup-java@v5.1.0
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v5.0.0

      - name: Prepare publication
        id: publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          SERVICES: ${{ inputs.services }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          mkdir -p build
          ./gradlew --no-daemon "-Prelease=$RELEASE_TAG" "-Prepo=$GH_REPO" \
            -PsourceRoot=.release-source -Passets=release-assets \
            -Poutput=build/publication.json "-PgithubOutput=$GITHUB_OUTPUT" \
            "-Pservices=$SERVICES" preparePublication

      - name: Validate or publish to Modrinth
        if: inputs.services != 'curseforge'
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          TARGET_ID: ${{ steps.publication.outputs.target }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          args=(--no-daemon -p build-config/publishing
            "-PpublicationMetadata=$PWD/build/publication.json"
            "-PsourceRoot=$PWD/.release-source" "-Ptarget=$TARGET_ID")
          if [[ "$RELEASE_TAG" == *+mc* ]]; then
            args+=("-PlegacyAssets=$PWD/release-assets")
          else
            args+=("-Pcandidate=$PWD/release-assets/candidate.json")
          fi
          if [[ "$DRY_RUN" == "true" ]]; then
            task=planModrinthUpload
          else
            if [[ -z "$MODRINTH_TOKEN" ]]; then
              echo "Missing MODRINTH_TOKEN for upload."
              exit 1
            fi
            task=modrinth
          fi
          ./gradlew "${args[@]}" "$task"

      - name: Upload to CurseForge
        if: ${{ !inputs.dry_run && inputs.services != 'modrinth' }}
        id: curseforge_upload
        uses: itsmeow/curseforge-upload@v3.1.2
        with:
          token: ${{ secrets.CF_API_TOKEN }}
          project_id: ${{ steps.publication.outputs.cf_project_id }}
          game_endpoint: minecraft
          relations: ${{ steps.publication.outputs.cf_relations }}
          file_path: ${{ steps.publication.outputs.artifact }}
          game_versions: ${{ steps.publication.outputs.cf_game_versions }}
          release_type: ${{ steps.publication.outputs.cf_release_type }}
          display_name: ${{ steps.publication.outputs.cf_display_name }}
          changelog: ${{ steps.publication.outputs.cf_changelog }}
          changelog_type: markdown

      - name: Save CurseForge upload record
        if: ${{ !inputs.dry_run && inputs.services != 'modrinth' }}
        env:
          CF_FILE_ID: ${{ steps.curseforge_upload.outputs.id }}
        run: |
          ./gradlew --no-daemon "-PpublicationMetadata=build/publication.json" \
            "-PfileId=$CF_FILE_ID" -Poutput=build/curseforge-result.json recordCurseForgeUpload

      - name: Save publication records
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: publication-${{ inputs.tag }}-${{ inputs.services }}
          path: |
            build/publication.json
            build/curseforge-result.json
            build/publishing/**/modrinth-plan.json
            build/publishing/**/modrinth-result.json
