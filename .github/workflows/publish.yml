name: Publish (GitHub Release)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Exact GitHub release tag, e.g. v1.4.2+mc26.2-fabric (drafts allowed for dry runs)"
        required: true
        type: string
      dry_run:
        description: "Validate release files and destination labels without uploading"
        required: true
        default: true
        type: boolean
      services:
        description: "Upload destinations; check CurseForge files before retrying an upload"
        required: true
        default: both
        type: choice
        options:
          - both
          - modrinth
          - curseforge
      curseforge_resume_run:
        description: "Previous Publish run containing CurseForge receipts; required when resuming accepted files"
        required: false
        default: ""
        type: string
      curseforge_unattempted_targets:
        description: "Resume only: comma-separated artifact owner IDs confirmed never attempted, after checking the previous run and CurseForge dashboard"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read
  attestations: read

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: "build and publish"
    outputs:
      matrix: ${{ steps.publication.outputs.matrix }}
    steps:
      - name: Require a new dispatch for CurseForge retries
        if: ${{ !inputs.dry_run && inputs.services != 'modrinth' && github.run_attempt != '1' }}
        run: |
          echo "::error::CurseForge uploads require a new dispatch: an earlier attempt may have uploaded files. Check the CurseForge project files, then dispatch only the services you still need."
          exit 1

      - name: Checkout publishing tools
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Validate release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          error() {
            local message="${1//%/%25}"
            message="${message//$'\r'/%0D}"
            message="${message//$'\n'/%0A}"
            printf '::error::%s\n' "$message"
          }
          encoded_tag="$(jq -rn --arg tag "$RELEASE_TAG" '$tag | @uri')"
          error_file="$RUNNER_TEMP/release-tag-error.txt"
          if ! gh api "repos/$GH_REPO/git/ref/tags/$encoded_tag" --silent 2>"$error_file"; then
            details="$(<"$error_file")"
            if [[ "$details" == *'HTTP 404'* ]]; then
              error "Release tag '$RELEASE_TAG' was not found in $GH_REPO. Copy an exact tag from the list below, including any + character."
              echo "Available release tags:"
              gh release list --repo "$GH_REPO" --limit 10 --json tagName --jq '.[].tagName' || true
            else
              error "Could not verify release tag '$RELEASE_TAG' in $GH_REPO: $details"
            fi
            exit 1
          fi
          if ! release="$(gh release view --repo "$GH_REPO" --json isDraft -- "$RELEASE_TAG" 2>"$error_file")"; then
            details="$(<"$error_file")"
            if [[ "$details" == *'HTTP 404'* || "$details" == *'release not found'* ]]; then
              error "Tag '$RELEASE_TAG' exists but has no GitHub release. Create its release before running Publish."
            else
              error "Could not read the GitHub release for '$RELEASE_TAG': $details"
            fi
            exit 1
          fi
          if [[ "$DRY_RUN" != 'true' ]] && jq -e '.isDraft == true' <<<"$release" >/dev/null; then
            error "Release '$RELEASE_TAG' is a draft. Use dry_run=true to validate it, or publish the GitHub release after acceptance passes before uploading to mod platforms."
            exit 1
          fi

      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          path: .release-source
          persist-credentials: false

      - name: Set up build Java 25
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6.4.0

      - name: Require the CBBG publication product
        if: startsWith(inputs.tag, 'lib/')
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir -p build
          ./gradlew --no-daemon "-Prelease=$RELEASE_TAG" -PrequireProduct=cbbg \
            -Poutput=build/publication-product.json releaseIdentity

      - name: Prepare publication
        id: publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          SERVICES: ${{ inputs.services }}
          DRY_RUN: ${{ inputs.dry_run }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          mkdir -p build
          ./gradlew --no-daemon "-Prelease=$RELEASE_TAG" "-Prepo=$GH_REPO" \
            -PsourceRoot=.release-source -Passets=release-assets \
            -Poutput=build/publication.json "-PgithubOutput=$GITHUB_OUTPUT" \
            "-Pservices=$SERVICES" "-PdryRun=$DRY_RUN" preparePublication

      - name: Restore CurseForge upload receipts
        if: inputs.services != 'modrinth'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          RESUME_RUN: ${{ inputs.curseforge_resume_run }}
        run: |
          mkdir -p build/curseforge-receipts
          if [[ -n "$RESUME_RUN" ]]; then
            if [[ ! "$RESUME_RUN" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::curseforge_resume_run must be a numeric Publish workflow run ID."
              exit 1
            fi
            gh api "repos/$GH_REPO/actions/runs/$RESUME_RUN" > build/curseforge-resume-run.json
            jq -e '.event == "workflow_dispatch" and .status == "completed" and (.path | split("@")[0]) == ".github/workflows/publish.yml"' build/curseforge-resume-run.json >/dev/null
            gh api --paginate --slurp "repos/$GH_REPO/actions/runs/$RESUME_RUN/jobs?filter=all&per_page=100" > build/curseforge-resume-jobs.json
            gh run download "$RESUME_RUN" --repo "$GH_REPO" \
              --pattern "publication-${RELEASE_TAG}-*" --dir build/curseforge-receipts
          fi

      - name: Check all CurseForge retry plans
        if: inputs.services != 'modrinth'
        env:
          RESUME_RUN: ${{ inputs.curseforge_resume_run }}
          UNATTEMPTED_TARGETS: ${{ inputs.curseforge_unattempted_targets }}
        run: |
          ./gradlew --no-daemon -PpublicationMetadata=build/publication.json \
            -PcurseforgeReceipts=build/curseforge-receipts -Passets=release-assets \
            -PcurseforgeResumeJobs=build/curseforge-resume-jobs.json \
            "-PcurseforgeResumeRun=$RESUME_RUN" "-PcurseforgeUnattemptedTargets=$UNATTEMPTED_TARGETS" \
            planCurseForgeUploads

      - name: Check all Modrinth retry plans
        if: inputs.services != 'curseforge'
        run: |
          python3 -c 'import json; records=json.load(open("build/publication.json"))["records"]; assert records; print("\n".join(r["targets"][0] for r in records))' > build/publication-targets.txt
          mapfile -t targets < build/publication-targets.txt
          for target in "${targets[@]}"; do
            args=(--no-daemon -p build-config/publishing
              "-PpublicationMetadata=$PWD/build/publication.json"
              "-PsourceRoot=$PWD/.release-source" "-Ptarget=$target")
            if jq -e '.legacy == true' build/publication.json >/dev/null; then
              args+=("-PlegacyAssets=$PWD/release-assets")
            else
              args+=("-Pcandidate=$PWD/release-assets/candidate.json")
            fi
            ./gradlew "${args[@]}" planModrinthUpload
          done

  publish:
    needs: preflight
    runs-on: ubuntu-latest
    environment: "build and publish"
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    steps:
      - name: Require a new dispatch for CurseForge retries
        if: ${{ !inputs.dry_run && inputs.services != 'modrinth' && github.run_attempt != '1' }}
        run: |
          echo "::error::CurseForge uploads require a new dispatch: an earlier attempt may have uploaded files. Check the CurseForge project files, then dispatch only the services you still need."
          exit 1

      - name: Checkout publishing tools
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          path: .release-source
          persist-credentials: false

      - name: Set up build Java 25
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6.4.0

      - name: Recheck publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          SERVICES: ${{ inputs.services }}
          DRY_RUN: ${{ inputs.dry_run }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          mkdir -p build
          ./gradlew --no-daemon "-Prelease=$RELEASE_TAG" "-Prepo=$GH_REPO" \
            -PsourceRoot=.release-source -Passets=release-assets \
            -Poutput=build/publication.json "-PgithubOutput=$GITHUB_OUTPUT" \
            "-Pservices=$SERVICES" "-PdryRun=$DRY_RUN" preparePublication

      - name: Select checked publication record
        id: publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          SERVICES: ${{ inputs.services }}
          TARGET_ID: ${{ matrix.target }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          ./gradlew --no-daemon "-Prelease=$RELEASE_TAG" "-Prepo=$GH_REPO" \
            -PsourceRoot=.release-source -Passets=release-assets \
            -PpublicationMetadata=build/publication.json "-Ptarget=$TARGET_ID" \
            "-PgithubOutput=$GITHUB_OUTPUT" "-Pservices=$SERVICES" selectPublication

      - name: Restore CurseForge upload receipts
        if: inputs.services != 'modrinth'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          RESUME_RUN: ${{ inputs.curseforge_resume_run }}
        run: |
          mkdir -p build/curseforge-receipts
          if [[ -n "$RESUME_RUN" ]]; then
            if [[ ! "$RESUME_RUN" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::curseforge_resume_run must be a numeric Publish workflow run ID."
              exit 1
            fi
            gh api "repos/$GH_REPO/actions/runs/$RESUME_RUN" > build/curseforge-resume-run.json
            jq -e '.event == "workflow_dispatch" and .status == "completed" and (.path | split("@")[0]) == ".github/workflows/publish.yml"' build/curseforge-resume-run.json >/dev/null
            gh api --paginate --slurp "repos/$GH_REPO/actions/runs/$RESUME_RUN/jobs?filter=all&per_page=100" > build/curseforge-resume-jobs.json
            gh run download "$RESUME_RUN" --repo "$GH_REPO" \
              --pattern "publication-${RELEASE_TAG}-*" --dir build/curseforge-receipts
          fi

      - name: Plan CurseForge upload family
        if: inputs.services != 'modrinth'
        id: curseforge_plan
        env:
          TARGET_ID: ${{ matrix.target }}
          RESUME_RUN: ${{ inputs.curseforge_resume_run }}
          UNATTEMPTED_TARGETS: ${{ inputs.curseforge_unattempted_targets }}
        run: |
          ./gradlew --no-daemon -PpublicationMetadata=build/publication.json \
            -PcurseforgeReceipts=build/curseforge-receipts -Passets=release-assets \
            -PcurseforgeResumeJobs=build/curseforge-resume-jobs.json \
            "-PcurseforgeResumeRun=$RESUME_RUN" "-PcurseforgeUnattemptedTargets=$UNATTEMPTED_TARGETS" \
            "-Ptarget=$TARGET_ID" "-PgithubOutput=$GITHUB_OUTPUT" \
            -Poutput=build/curseforge-plan.json planCurseForgeUploads

      - name: Validate or publish to Modrinth
        if: inputs.services != 'curseforge'
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          TARGET_ID: ${{ steps.publication.outputs.target }}
        run: |
          args=(--no-daemon -p build-config/publishing
            "-PpublicationMetadata=$PWD/build/publication.json"
            "-PsourceRoot=$PWD/.release-source" "-Ptarget=$TARGET_ID")
          if jq -e '.legacy == true' build/publication.json >/dev/null; then
            args+=("-PlegacyAssets=$PWD/release-assets")
          else
            args+=("-Pcandidate=$PWD/release-assets/candidate.json")
          fi
          if [[ "$DRY_RUN" == "true" ]]; then
            task=planModrinthUpload
          else
            if [[ -z "$MODRINTH_TOKEN" ]]; then
              echo "::error::Missing MODRINTH_TOKEN for upload. Configure this secret in the build and publish GitHub environment, or select CurseForge only. dry_run=true checks inputs without uploading."
              exit 1
            fi
            task=modrinth
          fi
          ./gradlew "${args[@]}" "$task"

      - name: Upload to CurseForge
        if: ${{ !inputs.dry_run && inputs.services != 'modrinth' }}
        id: curseforge_upload
        uses: qb20nh/curseforge-upload@bbaa5053cfd75b1dece0ee4bdb3df1b740ef47d8
        with:
          token: ${{ secrets.CF_API_TOKEN }}
          project_id: ${{ steps.publication.outputs.cf_project_id }}
          game_endpoint: minecraft
          relations: ${{ steps.publication.outputs.cf_relations }}
          file_path: ${{ steps.curseforge_plan.outputs.file_path }}
          additional_files: ${{ steps.curseforge_plan.outputs.additional_files }}
          parent_file_id: ${{ steps.curseforge_plan.outputs.parent_file_id }}
          receipt: ${{ steps.curseforge_plan.outputs.receipt }}
          manual_release: auto
          game_versions: ${{ steps.curseforge_plan.outputs.parent_file_id == '' && steps.publication.outputs.cf_game_versions || '' }}
          release_type: ${{ steps.publication.outputs.cf_release_type }}
          display_name: ${{ steps.curseforge_plan.outputs.display_name }}
          changelog: ${{ steps.publication.outputs.cf_changelog }}
          changelog_type: markdown

      - name: Save CurseForge action receipt
        if: ${{ always() && steps.curseforge_upload.outputs.receipt != '' }}
        env:
          RECEIPT_PATH: ${{ steps.curseforge_upload.outputs.receipt }}
        run: cp -- "$RECEIPT_PATH" build/curseforge-action-receipt.json

      - name: Save CurseForge upload record
        if: ${{ !inputs.dry_run && inputs.services != 'modrinth' }}
        env:
          TARGET_ID: ${{ matrix.target }}
        run: |
          CF_FILE_ID="$(jq -er '.parentID | select(type == "number" and . > 0)' build/curseforge-action-receipt.json)"
          ./gradlew --no-daemon "-PpublicationMetadata=build/publication.json" \
            "-Ptarget=$TARGET_ID" "-PfileId=$CF_FILE_ID" -Poutput=build/curseforge-result.json recordCurseForgeUpload
          echo "CurseForge accepted every file in this family. New main files remain held for manual release until all files are approved." >> "$GITHUB_STEP_SUMMARY"

      - name: Save publication records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: publication-${{ inputs.tag }}-${{ inputs.services }}-${{ matrix.target }}
          path: |
            build/publication.json
            build/curseforge-result.json
            build/curseforge-plan.json
            build/curseforge-action-receipt.json
            build/publishing/**/modrinth-plan.json
            build/publishing/**/modrinth-result.json
