name: CodeQL Advanced

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '18 12 * * 1'

permissions:
  contents: read

jobs:
  analyze-targets:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Set up build toolchains
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: |
            8
            17
            21
            25
      - uses: gradle/actions/setup-gradle@v6.3.0
      - name: Install CodeQL CLI
        id: codeql
        env:
          GH_TOKEN: ${{ github.token }}
          CODEQL_BUNDLE_VERSION: 2.27.1
          CODEQL_BUNDLE_SHA256: 7b6bde03f722503199b3f937548caa48c09f252323d96bfbc2acce974bf8b6db
        run: |
          bundle="codeql-bundle-java-linux64.tar.zst"
          install_dir="$RUNNER_TEMP/cbbg-codeql"
          mkdir -p "$install_dir"
          gh release download "codeql-bundle-v$CODEQL_BUNDLE_VERSION" \
            --repo github/codeql-action --pattern "$bundle" --dir "$install_dir"
          printf '%s  %s\n' "$CODEQL_BUNDLE_SHA256" "$install_dir/$bundle" | sha256sum --check
          tar --zstd -xf "$install_dir/$bundle" -C "$install_dir"
          rm "$install_dir/$bundle"
          "$install_dir/codeql/codeql" version
          printf 'codeql-path=%s\n' "$install_dir/codeql/codeql" >> "$GITHUB_OUTPUT"
      - name: Analyze Java artifact builds
        env:
          CODEQL_EXECUTABLE: ${{ steps.codeql.outputs.codeql-path }}
        run: |
          ./gradlew --no-daemon codeqlScan \
            "-PcodeqlExecutable=$CODEQL_EXECUTABLE" -PcodeqlLegacyTarget=26.2-fabric
      - name: Upload Java analyses
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: .gradle/codeql-results/sarif
          wait-for-processing: true

  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
