name: CodeQL Advanced

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '18 12 * * 1'

permissions:
  contents: read

jobs:
  analyze-targets:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Set up build toolchains
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: |
            8
            17
            21
            25
      - uses: gradle/actions/setup-gradle@v6.3.0
      - name: Set up CodeQL
        id: codeql
        uses: github/codeql-action/setup-codeql@v4
        with:
          languages: java-kotlin
      - name: Analyze Java artifact builds
        env:
          CODEQL_EXECUTABLE: ${{ steps.codeql.outputs.codeql-path }}
        run: |
          ./gradlew --no-daemon codeqlScan \
            "-PcodeqlExecutable=$CODEQL_EXECUTABLE" -PcodeqlLegacyTarget=26.2-fabric
      - name: Upload Java analyses
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: .gradle/codeql-results/sarif
          wait-for-processing: true

  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
