name: Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Explicit comma-separated candidate targets; run from the release tag"
        required: true
        type: string
        default: 26.3-fabric

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up build Java 25
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-read-only: false
          cache-cleanup: on-success

      - name: Validate release selection
        id: selection
        env:
          REQUESTED_TARGET: ${{ inputs.target }}
        run: |
          error() {
            local message="$1"
            message="${message//'%'/'%25'}"
            message="${message//$'\r'/'%0D'}"
            message="${message//$'\n'/'%0A'}"
            printf '::error::%s\n' "$message"
          }
          if [[ "$GITHUB_REF_TYPE" != "tag" || ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z][0-9A-Za-z.-]*\.[1-9][0-9]*)?(\+mc[0-9][0-9A-Za-z.-]*-(fabric|quilt|forge|neoforge|legacy-fabric))?$ ]]; then
            error "Release requires a version tag; selected '$GITHUB_REF_NAME' ($GITHUB_REF_TYPE). In Run workflow, choose a pushed tag under Use workflow from, e.g. v1.4.2+mc26.2-fabric or v1.4.2 for a shared release."
            exit 1
          fi
          mkdir -p build
          ./gradlew --no-daemon "-Ptarget=$REQUESTED_TARGET" \
            -PrequireImplemented=true -Poutput=build/release-selection.json targetMatrix
          while IFS=$'\t' read -r target profile java; do
            if [[ ! -f "build-config/$profile/build.gradle" ]]; then
              error "Missing build-config/$profile/build.gradle for target $target. Check its buildProfile in targets.json and commit the profile before creating a candidate."
              exit 1
            fi
          done < <(jq -r '.include[] | [.id, .buildProfile, .java] | @tsv' build/release-selection.json)
          IFS=',' read -ra targets <<< "$REQUESTED_TARGET"
          for target in "${targets[@]}"; do
            for suffix in scenarios mods linux-x86_64; do
              if [[ ! -f "runtime-locks/$target-$suffix.json" ]]; then
                error "Missing runtime-locks/$target-$suffix.json. Add and commit the target's test contract and dependency/runtime locks before creating a candidate."
                exit 1
              fi
            done
          done
          printf 'targets=%s\n' "$REQUESTED_TARGET" >> "$GITHUB_OUTPUT"
          echo 'java<<JAVA_VERSIONS' >> "$GITHUB_OUTPUT"
          jq -r --slurpfile catalog targets.json \
            '([25] + [.include[] | .java, (.id as $id | $catalog[0].targets[] | select(.id == $id) | (.buildJava // 25))]) | unique | (map(select(. != 25)) + [25]) | .[]' \
            build/release-selection.json >> "$GITHUB_OUTPUT"
          echo 'JAVA_VERSIONS' >> "$GITHUB_OUTPUT"

      - name: Select release notes
        env:
          TARGETS: ${{ steps.selection.outputs.targets }}
        run: |
          ./gradlew --no-daemon "-Prelease=$GITHUB_REF_NAME" "-Ptargets=$TARGETS" \
            -Poutput=build/release-notes.md releaseNotes

      - name: Check release does not already exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "::error::A GitHub release already exists for this tag. Use its candidate, or choose a new version. To replace an unpublished draft, remove that draft explicitly before dispatching Release again."
            exit 1
          fi

      - name: Set up catalog Java versions
        uses: actions/setup-java@v6.0.1
        with:
          java-version: ${{ steps.selection.outputs.java }}
          distribution: temurin

      - name: Test candidate tooling
        run: |
          ./gradlew -p build-logic --no-daemon --build-cache test
          python3 -m pip install --disable-pip-version-check -r .github/scripts/requirements.txt
          python3 -m unittest discover -s scripts/tests
          python3 -m unittest discover -s .github/tests

      - name: Build and bundle candidate
        env:
          TARGETS: ${{ steps.selection.outputs.targets }}
        run: |
          export JAVA_HOME="$JAVA_HOME_25_X64"
          while IFS= read -r target; do
            ./gradlew --no-daemon --console=plain "-Ptarget=${target}" candidateBuildOutputs
          done < <(jq -r '.include[].id' build/release-selection.json)
          ./gradlew --no-daemon --console=plain \
            "-Ptargets=${TARGETS}" \
            -Poutput=build/release-candidate "-Prelease=${GITHUB_REF_NAME}" \
            bundleCandidate

      - name: Attest candidate files
        id: provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: build/release-candidate/*

      - name: Verify candidate provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp "${PROVENANCE_BUNDLE}" build/release-candidate/provenance.jsonl
          ./gradlew --no-daemon \
            -Pcandidate=build/release-candidate/candidate.json \
            -Pbundle=build/release-candidate/provenance.jsonl \
            "-Prepo=${GH_REPO}" -Poutput=build/provenance-result.json verifyProvenance
          ./gradlew --no-daemon \
            -Pcandidate=build/release-candidate/candidate.json \
            "-Prepo=${GH_REPO}" packageReleaseEvidence

      - name: Store private candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cbbg-candidate
          path: build/release-candidate/
          if-no-files-found: error

      - name: Prepare public release assets
        run: |
          ./gradlew --no-daemon \
            -Pcandidate=build/release-candidate/candidate.json \
            -Poutput=build/release-assets preparePublicReleaseAssets

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TARGETS: ${{ steps.selection.outputs.targets }}
        run: |
          printf '\n<!-- cbbg-candidate-run: %s -->\n' "${GITHUB_RUN_ID}" >> build/release-notes.md
          version="${GITHUB_REF_NAME#v}"
          version="${version%%+*}"
          title="cbbg $version"
          if [[ "$GITHUB_REF_NAME" == *+mc* ]]; then
            scope="$(jq -er --arg ids "$TARGETS" '
              {fabric: "Fabric", quilt: "Quilt", forge: "Forge",
               neoforge: "NeoForge", "legacy-fabric": "Legacy Fabric"} as $labels |
              ($ids | split(",")) as $ids |
              .targets as $catalog |
              [$catalog[] | select(.id as $id | $ids | index($id))] as $selected |
              ($selected | map(.minecraft) | unique) as $versions |
              ($catalog[] | select(.id == ($selected[0].artifactOf // $selected[0].id))) as $owner |
              ([$owner.minecraft] + ($owner.compatibleMinecraft // []) | unique) as $family |
              (if ($family | length) > 1 and $versions == $family and
                  all($family[]; . == $owner.minecraft or startswith($owner.minecraft + "."))
               then $owner.minecraft + ".x" else $versions | join(", ") end) as $minecraft |
              ($selected | map(.loader as $loader |
                $labels[$loader] // error("Unknown release loader: " + $loader)) |
                unique | join(", ")) as $loaders |
              "Minecraft \($minecraft) \($loaders)"
            ' targets.json)"
            title="cbbg $version for $scope"
          fi
          flags=()
          if [[ "$version" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" build/release-assets/* \
            --verify-tag --draft --title "$title" \
            --notes-file build/release-notes.md \
            "${flags[@]}"
