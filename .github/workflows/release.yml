name: Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Candidate target; run this workflow from the release tag"
        required: true
        type: choice
        options:
          - 26.3-fabric

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v5.1.0
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v5.0.0

      - name: Validate release selection
        id: selection
        env:
          REQUESTED_TARGET: ${{ inputs.target }}
        run: |
          if [[ "$GITHUB_REF_TYPE" != "tag" || ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z][0-9A-Za-z.-]*\.[1-9][0-9]*)?$ ]]; then
            echo "Run this workflow from an explicit version release tag."
            exit 1
          fi
          mkdir -p build
          ./gradlew --no-daemon "-Ptarget=$REQUESTED_TARGET" \
            -PrequireImplemented=true -Poutput=build/release-selection.json targetMatrix
          target="$(jq -r '.include[0].id' build/release-selection.json)"
          profile="$(jq -r '.include[0].buildProfile' build/release-selection.json)"
          java="$(jq -r '.include[0].java' build/release-selection.json)"
          if [[ "$target" != "$REQUESTED_TARGET" || "$profile" != "fabric-modern" ]]; then
            echo "Candidate workflow is not configured for this target."
            exit 1
          fi
          for suffix in scenarios mods linux-x86_64; do
            if [[ ! -f "runtime-locks/$target-$suffix.json" ]]; then
              echo "Missing candidate test inputs: $suffix"
              exit 1
            fi
          done
          printf 'target=%s\njava=%s\nprofile=%s\n' "$target" "$java" "$profile" >> "$GITHUB_OUTPUT"

      - name: Check release does not already exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release already exists; its candidate files cannot be replaced."
            exit 1
          fi

      - uses: actions/setup-java@v5.1.0
        with:
          java-version: ${{ steps.selection.outputs.java }}
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v5.0.0
        with:
          cache-read-only: false
          cache-cleanup: on-success

      - name: Test candidate tooling
        run: |
          ./gradlew -p build-logic --no-daemon test
          python3 -m unittest discover -s scripts/tests
          python3 -m unittest discover -s .github/tests

      - name: Build and bundle candidate
        env:
          TARGET: ${{ steps.selection.outputs.target }}
          BUILD_PROFILE: ${{ steps.selection.outputs.profile }}
        run: |
          ./gradlew --no-daemon --console=plain "-Ptarget=${TARGET}" candidateBuildOutputs
          ./gradlew --no-daemon --console=plain \
            "-PbuildOutputs=build/targets/${TARGET}/candidate-build-outputs.json" \
            -Poutput=build/release-candidate "-Prelease=${GITHUB_REF_NAME}" \
            "-Pcontract=runtime-locks/${TARGET}-scenarios.json" \
            "-PruntimeLock=runtime-locks/${TARGET}-linux-x86_64.json" \
            "-PdependencyLock=runtime-locks/${TARGET}-mods.json" bundleCandidate

      - name: Attest candidate files
        id: provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: build/release-candidate/*

      - name: Verify candidate provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp "${PROVENANCE_BUNDLE}" build/release-candidate/provenance.jsonl
          ./gradlew --no-daemon \
            -Pcandidate=build/release-candidate/candidate.json \
            -Pbundle=build/release-candidate/provenance.jsonl \
            "-Prepo=${GH_REPO}" -Poutput=build/provenance-result.json verifyProvenance

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" build/release-candidate/* \
            --verify-tag --draft --title "cbbg ${GITHUB_REF_NAME#v}" \
            --notes "Candidate for local acceptance testing. Release notes will be added before publication." \
            "${flags[@]}"
