name: Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Candidate target; run this workflow from the release tag"
        required: true
        type: choice
        options:
          - 26.3-fabric

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release selection
        id: selection
        env:
          REQUESTED_TARGET: ${{ inputs.target }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys
          sys.path.insert(0, 'scripts')
          from parity_evidence import selected_target_specs, validate_release_identity
          from targets import load_catalog

          if os.environ['GITHUB_REF_TYPE'] != 'tag':
              raise SystemExit('Run this workflow from an explicit release tag')
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          validate_release_identity(os.environ['GITHUB_REF_NAME'], commit)
          selected = selected_target_specs(load_catalog(), [os.environ['REQUESTED_TARGET']])
          target, = selected.values()
          if target['loader'] != 'fabric' or target.get('buildProfile') != 'fabric-modern':
              raise SystemExit('Candidate workflow is not configured for this target')
          for suffix in ('scenarios', 'mods', 'linux-x86_64'):
              if not Path('runtime-locks', target['id'] + '-' + suffix + '.json').is_file():
                  raise SystemExit('Missing candidate test inputs: ' + suffix)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key, value in [('target', target['id']), ('java', target['java']),
                                 ('profile', target['buildProfile'])]:
                  print(str(key) + '=' + str(value), file=output)
          PY

      - name: Check release does not already exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release already exists; its candidate files cannot be replaced."
            exit 1
          fi

      - uses: actions/setup-java@v5.1.0
        with:
          java-version: ${{ steps.selection.outputs.java }}
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v5.0.0
        with:
          cache-read-only: false
          cache-cleanup: on-success

      - name: Test candidate tooling
        run: |
          python3 -m unittest discover -s scripts/tests
          python3 -m unittest discover -s .github/tests

      - name: Build and bundle candidate
        env:
          TARGET: ${{ steps.selection.outputs.target }}
          BUILD_PROFILE: ${{ steps.selection.outputs.profile }}
        run: |
          ./gradlew -p "build-config/${BUILD_PROFILE}" --no-daemon --console=plain \
            "-Ptarget=${TARGET}" candidateBuildOutputs
          python3 scripts/bundle_candidate.py \
            --source-root . \
            --build-outputs "build/targets/${TARGET}/candidate-build-outputs.json" \
            --output build/release-candidate \
            --release "${GITHUB_REF_NAME}" \
            --contract "runtime-locks/${TARGET}-scenarios.json" \
            --runtime-lock "runtime-locks/${TARGET}-linux-x86_64.json" \
            --dependency-lock "runtime-locks/${TARGET}-mods.json"

      - name: Attest candidate files
        id: provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: build/release-candidate/*

      - name: Verify candidate provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp "${PROVENANCE_BUNDLE}" build/release-candidate/provenance.jsonl
          python3 scripts/candidate_provenance.py \
            --candidate build/release-candidate/candidate.json \
            --bundle build/release-candidate/provenance.jsonl \
            --repo "${GH_REPO}"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" build/release-candidate/* \
            --verify-tag --draft --title "cbbg ${GITHUB_REF_NAME#v}" \
            --notes "Candidate for local acceptance testing. Release notes will be added before publication." \
            "${flags[@]}"
