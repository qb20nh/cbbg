plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
}

import groovy.json.JsonSlurper

def repositoryRoot = file('../..')
apply from: new File(repositoryRoot, 'build-config/local-runtime.gradle')
def catalog = new JsonSlurper().parse(new File(repositoryRoot, 'targets.json'))
def targetId = providers.gradleProperty('target').getOrElse('26.3-fabric')
def target = catalog.targets.find { it.id == targetId }
if (target == null || target.buildProfile != 'fabric-modern') {
    throw new GradleException("Target ${targetId} is not configured for the modern Fabric profile")
}
def modProperties = new Properties()
new File(repositoryRoot, 'gradle.properties').withInputStream { modProperties.load(it) }
version = "${modProperties.mod_version}+mc${target.minecraft}-${target.loader}"
group = modProperties.maven_group
base.archivesName = modProperties.archives_base_name
layout.buildDirectory = new File(repositoryRoot, "build/targets/${targetId}")

evaluationDependsOn(':core')

repositories {
    mavenCentral()
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    maven { url = 'https://api.modrinth.com/maven' }
}

def testCompat = providers.gradleProperty('compat').getOrElse('none')
if (!target.compatibilityProfiles.containsKey(testCompat)) {
    throw new GradleException("Unsupported compatibility fixture: ${testCompat}")
}

dependencies {
    minecraft "com.mojang:minecraft:${target.minecraft}"
    implementation "net.fabricmc:fabric-loader:${target.dependencies.loader}"
    implementation "net.fabricmc.fabric-api:fabric-api:${target.dependencies.fabricApi}"
    implementation project(':core')
    compileOnly("com.terraformersmc:modmenu:${target.dependencies.modMenu}") { transitive = false }
    if (testCompat.tokenize('+').contains('modmenu')) {
        runtimeOnly("com.terraformersmc:modmenu:${target.dependencies.modMenu}") { transitive = false }
    }
    if (testCompat.tokenize('+').contains('iris')) {
        runtimeOnly("maven.modrinth:iris:${target.dependencies.iris}") { transitive = false }
    }
    if (testCompat.tokenize('+').contains('immediatelyfast')) {
        runtimeOnly("maven.modrinth:immediatelyfast:${target.dependencies.immediatelyFast}") { transitive = false }
    }
    if (testCompat.tokenize('+').contains('sulkan')) {
        runtimeOnly("maven.modrinth:sulkan:${target.dependencies.sulkan}") { transitive = false }
    }
    if (testCompat.tokenize('+').any { it == 'iris' || it == 'sodium' || it == 'sulkan' }) {
        runtimeOnly("maven.modrinth:sodium:${target.dependencies.sodium}") { transitive = false }
    }
    if (testCompat.tokenize('+').contains('chatpatches')) {
        runtimeOnly("maven.modrinth:chatpatches:${target.dependencies.chatPatches}") { transitive = false }
        runtimeOnly("maven.modrinth:yacl:${target.dependencies.yacl}") { transitive = false }
    }
    if (testCompat.tokenize('+').contains('renderscale')) {
        runtimeOnly("maven.modrinth:renderscale:${target.dependencies.renderScale}") { transitive = false }
        runtimeOnly("maven.modrinth:cloth-config:${target.dependencies.clothConfig}") { transitive = false }
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(target.java as int)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = target.java as int
}

def sourceGroups = ["renderers/${target.renderer}", "adapters/minecraft/${target.minecraft}",
                    "adapters/fabric/${target.minecraft}"]
def usesTextureFormat = target.renderer == 'blaze-texture-format'
sourceGroups.addAll(target.sourceGroups ?: [])
sourceSets.main {
    java.setSrcDirs(sourceGroups.collect { new File(repositoryRoot, "${it}/src/main/java") })
    resources.setSrcDirs(sourceGroups.collect { new File(repositoryRoot, "${it}/src/main/resources") })
}

// Reuse compatible Fabric commands and noise sources without copies.
def sharedModern = objects.sourceDirectorySet('sharedModern', 'Shared modern Fabric sources')
sharedModern.srcDir(new File(repositoryRoot, 'adapters/fabric/shared/src/main/java'))
if (usesTextureFormat) {
    sharedModern.exclude 'com/qb20nh/cbbg/CbbgEarlyInit.java',
            'com/qb20nh/cbbg/CbbgClient.java',
            'com/qb20nh/cbbg/config/gui/CbbgConfigScreen.java',
            'com/qb20nh/cbbg/render/BlazePlatform.java'
    sourceSets.main.resources.srcDir(new File(repositoryRoot, 'src/main/resources'))
} else {
    sharedModern.include 'com/qb20nh/cbbg/Cbbg.java',
            'com/qb20nh/cbbg/platform/LoaderPlatform.java',
            'com/qb20nh/cbbg/command/CbbgClientCommands.java',
            'com/qb20nh/cbbg/platform/Text.java',
            'com/qb20nh/cbbg/command/CommandPlatform.java',
            'com/qb20nh/cbbg/config/gui/CbbgConfigWidgets.java',
            'com/qb20nh/cbbg/config/gui/WidgetPlatform.java',
            'com/qb20nh/cbbg/compat/iris/IrisCompat.java',
            'com/qb20nh/cbbg/compat/renderscale/RenderScaleCompat.java',
            'com/qb20nh/cbbg/compat/modmenu/CbbgModMenuApi.java',
            'com/qb20nh/cbbg/render/stbn/STBNGenerator.java',
            'com/qb20nh/cbbg/render/stbn/STBNLoader.java',
            'com/qb20nh/cbbg/render/stbn/StbnImagePixels.java',
            'com/qb20nh/cbbg/render/stbn/STBNCache.java'
    sharedModern.include 'com/qb20nh/cbbg/render/MainTargets.java'
}
sourceSets.main.java.source(sharedModern)

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'cbbg-renderer-test'
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

def testBackend = providers.gradleProperty('backend').getOrElse('opengl')
if (!target.backends.contains(testBackend)) {
    throw new GradleException("Backend ${testBackend} is not supported by ${targetId}")
}
if (!target.compatibilityProfiles[testCompat].contains(testBackend)) {
    throw new GradleException("Compatibility fixture ${testCompat} does not support ${testBackend} for ${targetId}")
}
loom.runs.named('clientGameTest') {
    if (!usesTextureFormat) {
        programArgs '--graphicsBackend', testBackend
    }
    vmArg "-Dcbbg.test.backend=${testBackend}"
    vmArg "-Dcbbg.test.compat=${testCompat}"
    vmArg "-Dcbbg.test.modmenu.version=${target.dependencies.modMenu}"
    def evidenceProfile = testCompat == 'none' ? 'readback' : testCompat
    vmArg "-Dcbbg.test.evidence=${layout.buildDirectory.get().asFile}/evidence/${evidenceProfile}"
}

sourceSets.gametest {
    java.setSrcDirs(sourceGroups.collect { new File(repositoryRoot, "${it}/src/gametest/java") })
    java.srcDirs(sourceGroups.collect { new File(repositoryRoot, "${it}/src/parity/java") })
    java.srcDir(new File(repositoryRoot, 'core/src/testSupport/java'))
    resources.setSrcDirs(sourceGroups.collect { new File(repositoryRoot, "${it}/src/gametest/resources") })
}

def sharedClientTests = objects.sourceDirectorySet('sharedClientTests', 'Shared Fabric UI scenarios')
sharedClientTests.srcDir(new File(repositoryRoot, 'adapters/fabric/shared/src/gametest/java'))
if (usesTextureFormat) {
    sharedClientTests.exclude 'com/qb20nh/cbbg/gametest/ClientTestAccess.java'
    def sharedCompatTests = objects.sourceDirectorySet('sharedCompatTests', 'Shared optional-mod scenarios')
    sharedCompatTests.srcDir(new File(repositoryRoot, 'renderers/modern/src/gametest/java'))
    sharedCompatTests.include 'com/qb20nh/cbbg/gametest/ModMenuGameTest.java',
            'com/qb20nh/cbbg/gametest/IrisFixture.java',
            'com/qb20nh/cbbg/gametest/RenderScaleTestAccess.java',
            'com/qb20nh/cbbg/gametest/OptionalModsGameTest.java'
    sourceSets.gametest.java.source(sharedCompatTests)
} else {
    sharedClientTests.include 'com/qb20nh/cbbg/gametest/CbbgConfigScreenGameTest.java'
}
sourceSets.gametest.java.source(sharedClientTests)

tasks.named('jar') {
    from(project(':core').sourceSets.main.output)
    from(new File(repositoryRoot, 'LICENSE'))
    // Source generation is useful before an adapter exists, but an empty adapter
    // must never produce a plausible distribution artifact.
    doFirst {
        if (!target.implemented) {
            throw new GradleException("Distribution implementation remains incomplete for ${targetId}")
        }
        if (!sourceSets.main.resources.matching { include 'fabric.mod.json' }.files) {
            throw new GradleException("Adapter metadata is not implemented for ${targetId}")
        }
    }
}

tasks.named('processResources') {
    if (!usesTextureFormat) {
        from(new File(repositoryRoot, 'src/main/resources')) {
            include 'assets/cbbg/shaders/include/dither.glsl'
            include 'assets/cbbg/lang/*.json'
        }
    }
    def properties = [version: project.version, minecraft_version: target.minecraft,
                      loader_version: target.dependencies.loader, java_version: target.java,
                      renderer_family: target.renderer,
                      shader_import: target.renderer == 'blaze-gpu-format' ? '#moj_import' : '#include']
    inputs.properties(properties)
    filesMatching('fabric.mod.json') { expand(properties) }
    if (usesTextureFormat) {
        filesMatching('fabric.mod.json') {
            filter { line -> line.replace('afl:prePrePreLaunch', 'preLaunch')
                    .replace('>=21', ">=${properties.java_version}")
                    .replace('>=0.18.2', ">=${properties.loader_version}") }
        }
    }
    if (target.renderer == 'blaze-gpu-format') {
        filesMatching('assets/cbbg/shaders/core/cbbg_dither.fsh') {
            filter { line -> line.replace('#include <', "${properties.shader_import} <") }
        }
    }
}

tasks.named('sourcesJar') {
    from(project(':core').sourceSets.main.allSource)
}

// Minecraft 26.x uses published names in production; these artifacts need no remap.
// Keep local candidate testing separate from the distribution readiness gate.
def parityCandidateJar = tasks.register('parityCandidateJar', Jar) {
    archiveClassifier = 'parity-candidate'
    from sourceSets.main.output
    from project(':core').sourceSets.main.output
    from new File(repositoryRoot, 'LICENSE')
}
def parityDriverJar = tasks.register('parityDriverJar', Jar) {
    archiveClassifier = 'parity-driver'
    from sourceSets.gametest.output
}

// Startup-state and slow maximum-size fixtures run independently of the ordinary suite.
if (target.renderer == 'renderpearl') {
    [irisRestart: ['IrisRestartGameTest'],
     sulkan: ['SulkanGameTest'],
     sulkanRestart: ['SulkanRestartGameTest'],
     maximumNoiseCache: ['Rgba8ReadbackGameTest', 'MaximumNoiseCacheGameTest'],
     worldPixels: ['Rgba8ReadbackGameTest', 'WorldPixelsGameTest'],
     worldControl: ['Rgba8ReadbackGameTest', 'WorldControlGameTest'],
     debugOverlay: ['Rgba8ReadbackGameTest', 'DebugOverlayGameTest'],
     irisDebug: ['Rgba8ReadbackGameTest', 'IrisGameTest'],
     shaderFailure: ['Rgba8ReadbackGameTest', 'ShaderFailureGameTest', 'PresentationGameTest'],
     dsaBenchmark: ['Rgba8ReadbackGameTest', 'DitherPassGameTest', 'PresentationGameTest',
                    'DsaBenchmarkGameTest']].each { fixture, entrypoints ->
        def fixtureMetadata = tasks.register("${fixture}Metadata") {
            dependsOn tasks.named('processGametestResources')
            def source = layout.buildDirectory.file('resources/gametest/fabric.mod.json')
            def destination = layout.buildDirectory.file("${fixture}/fabric.mod.json")
            inputs.file(source)
            inputs.property('entrypoints', entrypoints)
            outputs.file(destination)
            doLast {
                def metadata = new JsonSlurper().parse(source.get().asFile)
                metadata.entrypoints['fabric-client-gametest'] =
                        entrypoints.collect { "com.qb20nh.cbbg.gametest.${it}".toString() }
                if (fixture == 'dsaBenchmark') {
                    metadata.entrypoints.client = ['com.qb20nh.cbbg.gametest.DsaBenchmarkSettings']
                }
                destination.get().asFile.parentFile.mkdirs()
                destination.get().asFile.text = groovy.json.JsonOutput.prettyPrint(
                        groovy.json.JsonOutput.toJson(metadata))
            }
        }
        tasks.register("${fixture}DriverJar", Jar) {
            archiveClassifier = [irisRestart: 'iris-restart-driver',
                                 sulkan: 'sulkan-driver',
                                 sulkanRestart: 'sulkan-restart-driver',
                                 maximumNoiseCache: 'maximum-noise-cache-driver',
                                 worldPixels: 'world-pixels-driver',
                                 worldControl: 'world-control-driver',
                                 debugOverlay: 'debug-overlay-driver',
                                 irisDebug: 'iris-debug-driver',
                                 shaderFailure: 'shader-failure-driver',
                                 dsaBenchmark: 'dsa-benchmark-driver'][fixture]
            from(sourceSets.gametest.output) { exclude 'fabric.mod.json' }
            from(fixtureMetadata)
        }
    }
}

tasks.register('verifyCandidatePackaging', Exec) {
    group = 'verification'
    description = 'Check production bytecode and embedded core without launching Minecraft.'
    dependsOn parityCandidateJar, tasks.named('sourcesJar')
    workingDir repositoryRoot
    doFirst {
        commandLine 'python3', 'scripts/artifact_checks.py', '--target', targetId,
                '--artifact', parityCandidateJar.get().archiveFile.get().asFile,
                '--sources', tasks.named('sourcesJar').get().archiveFile.get().asFile
    }
}
tasks.register('prepareParityRuntime') {
    dependsOn parityDriverJar, tasks.named('verifyCandidatePackaging')
}

tasks.register('dev', Sync) {
    group = 'build'
    description = 'Check and package local development jars without release readiness claims.'
    dependsOn tasks.named('check'), tasks.named('verifyCandidatePackaging')
    into layout.buildDirectory.dir('dev')
    from(parityCandidateJar.flatMap { it.archiveFile }) {
        rename { "${base.archivesName.get()}-${project.version}-dev.jar" }
    }
    from(tasks.named('sourcesJar').flatMap { it.archiveFile }) {
        rename { "${base.archivesName.get()}-${project.version}-dev-sources.jar" }
    }
}

if (usesTextureFormat) {
    tasks.named('processGametestResources') {
        from(new File(repositoryRoot, 'renderers/modern/src/gametest/resources')) {
            include 'cbbg-iris-fixture/**'
        }
    }
}
