plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
    id 'cbbg.packaging'
    id 'cbbg.quality'
}

import groovy.json.JsonSlurper

def repositoryRoot = file('../..')
apply from: new File(repositoryRoot, 'build-config/local-runtime.gradle')
def catalog = cbbg.gradle.TargetCatalog.read(new File(repositoryRoot, 'targets.json')).data
def targetId = providers.gradleProperty('target').getOrElse('26.3-fabric')
def target = catalog.targets.find { it.id == targetId }
if (target == null || target.buildProfile != 'fabric-modern') {
    throw new GradleException("Target ${targetId} is not configured for the modern Fabric profile")
}
def artifactOwner = target.artifactOf ? catalog.targets.find { it.id == target.artifactOf } : target
def launchesClient = gradle.startParameter.taskNames.any {
    it.tokenize(':').last() in ['runClient', 'runClientGameTest']
}
def gameTarget = launchesClient ? target : artifactOwner
def modProperties = new Properties()
new File(repositoryRoot, 'gradle.properties').withInputStream { modProperties.load(it) }
version = cbbg.gradle.CandidateManifest.packageVersion('v' + modProperties.mod_version, artifactOwner)
group = modProperties.maven_group
base.archivesName = modProperties.archives_base_name
layout.buildDirectory = new File(repositoryRoot, "build/targets/${targetId}")

ext.sharedProjects = [project(':core'), project(':core:rendering')]
apply from: new File(repositoryRoot, 'build-config/shared-code.gradle')

repositories {
    mavenCentral()
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    maven { url = 'https://api.modrinth.com/maven' }
}

def testCompat = providers.gradleProperty('compat').getOrElse('none')
if (!target.compatibilityProfiles.containsKey(testCompat)) {
    throw new GradleException("Unsupported compatibility fixture: ${testCompat}")
}
def effectiveDependencies = cbbg.gradle.TargetCatalog.effectiveDependencies(target, testCompat)

dependencies {
    minecraft "com.mojang:minecraft:${gameTarget.minecraft}"
    implementation "net.fabricmc:fabric-loader:${gameTarget.dependencies.loader}"
    implementation "net.fabricmc.fabric-api:fabric-api:${gameTarget.dependencies.fabricApi}"
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    compileOnly("com.terraformersmc:modmenu:${target.dependencies.modMenu}") { transitive = false }
    if (testCompat.tokenize('+').contains('modmenu')) {
        runtimeOnly("com.terraformersmc:modmenu:${effectiveDependencies.modMenu}") { transitive = false }
    }
    if (testCompat.tokenize('+').contains('iris')) {
        runtimeOnly("maven.modrinth:iris:${effectiveDependencies.iris}") { transitive = false }
    }
    if (testCompat.tokenize('+').contains('immediatelyfast')) {
        runtimeOnly("maven.modrinth:immediatelyfast:${effectiveDependencies.immediatelyFast}") { transitive = false }
    }
    if (testCompat.tokenize('+').contains('sulkan')) {
        runtimeOnly("maven.modrinth:sulkan:${effectiveDependencies.sulkan}") { transitive = false }
    }
    if (testCompat.tokenize('+').any { it == 'iris' || it == 'sodium' || it == 'sulkan' }) {
        runtimeOnly("maven.modrinth:sodium:${effectiveDependencies.sodium}") { transitive = false }
    }
    if (testCompat.tokenize('+').contains('chatpatches')) {
        runtimeOnly("maven.modrinth:chatpatches:${effectiveDependencies.chatPatches}") { transitive = false }
        runtimeOnly("maven.modrinth:yacl:${effectiveDependencies.yacl}") { transitive = false }
    }
    if (testCompat.tokenize('+').contains('renderscale')) {
        runtimeOnly("maven.modrinth:renderscale:${effectiveDependencies.renderScale}") { transitive = false }
        runtimeOnly("maven.modrinth:cloth-config:${effectiveDependencies.clothConfig}") { transitive = false }
    }
}

test {
    useJUnitPlatform()
    def testGameDir = layout.buildDirectory.dir('test-gamedir').get().asFile
    doFirst { testGameDir.mkdirs() }
    workingDir = testGameDir
    systemProperty 'fabric.gameDir', testGameDir.absolutePath
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(target.java as int)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = target.java as int
}

def usesTextureFormat = target.renderer == 'blaze-texture-format'
def sourceLayout = cbbg.gradle.FabricSources.layout(target, artifactOwner)
['main', 'test'].each { name ->
    cbbg.gradle.FabricSources.configure(project, repositoryRoot, sourceLayout, name)
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'cbbg-renderer-test'
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

def testBackend = providers.gradleProperty('backend').getOrElse('opengl')
if (!target.backends.contains(testBackend)) {
    throw new GradleException("Backend ${testBackend} is not supported by ${targetId}")
}
if (!target.compatibilityProfiles[testCompat].contains(testBackend)) {
    throw new GradleException("Compatibility fixture ${testCompat} does not support ${testBackend} for ${targetId}")
}
loom.runs.named('clientGameTest') {
    if (!usesTextureFormat) {
        programArgs '--graphicsBackend', testBackend
    }
    vmArg "-Dcbbg.test.backend=${testBackend}"
    vmArg "-Dcbbg.test.compat=${testCompat}"
    vmArg "-Dcbbg.test.modmenu.version=${target.dependencies.modMenu}"
    def evidenceProfile = testCompat == 'none' ? 'readback' : testCompat
    vmArg "-Dcbbg.test.evidence=${layout.buildDirectory.get().asFile}/evidence/${evidenceProfile}"
}

cbbg.gradle.FabricSources.configure(project, repositoryRoot, sourceLayout, 'gametest')

if (usesTextureFormat) {
    def externalCompileClasspath = configurations.compileClasspath.incoming.artifactView {
        componentFilter { it instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier }
    }.files
    sourceSets.create('processedGametest') {
        compileClasspath = files(releaseOptimization.outputJar, externalCompileClasspath)
        runtimeClasspath = output + compileClasspath
    }
    cbbg.gradle.FabricSources.configure(project, repositoryRoot, sourceLayout, 'processedGametest')
    tasks.named('compileProcessedGametestJava') {
        dependsOn tasks.named('optimizeReleaseJar')
    }
    tasks.named('processProcessedGametestResources') {
        dependsOn tasks.named('optimizeReleaseJar')
        from(releaseOptimization.mappingFile) { rename { 'cbbg-test.map' } }
        cbbg.gradle.FabricSources.copyResources(project, repositoryRoot, sourceLayout, 'processedGametest', delegate)
        def loaderMinimum = artifactOwner.dependencies.minimumLoader ?: artifactOwner.dependencies.loader
        inputs.property('loaderMinimum', loaderMinimum)
        filesMatching('fabric.mod.json') { expand(loader_minimum: loaderMinimum) }
    }
    tasks.register('processedDriverJar', Jar) {
        archiveClassifier = 'processed-driver'
        from sourceSets.processedGametest.output
    }
    tasks.register('prepareProcessedRuntime') {
        dependsOn tasks.named('optimizeReleaseJar'), tasks.named('processedDriverJar'),
                tasks.named('checkPackages')
    }
    apply from: new File(repositoryRoot, 'build-config/fabric-startup-tests.gradle')
}

if (targetId == '26.3-fabric') {
    // Select resolved external artifacts, including Loom's Minecraft jar, without
    // carrying unprocessed main classes or the shared project outputs into compilation.
    def externalCompileClasspath = configurations.compileClasspath.incoming.artifactView {
        componentFilter { it instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier }
    }.files
    sourceSets.create('processedGametest') {
        compileClasspath = files(releaseOptimization.outputJar, externalCompileClasspath)
        runtimeClasspath = output + compileClasspath
    }
    cbbg.gradle.FabricSources.configure(project, repositoryRoot, sourceLayout, 'processedGametest')
    tasks.named('compileProcessedGametestJava') {
        dependsOn tasks.named('optimizeReleaseJar')
    }
    tasks.named('processProcessedGametestResources') {
        def loaderMinimum = target.dependencies.minimumLoader ?: target.dependencies.loader
        inputs.property('loaderMinimum', loaderMinimum)
        filesMatching('fabric.mod.json') { expand(loader_minimum: loaderMinimum) }
        cbbg.gradle.FabricSources.copyResources(project, repositoryRoot, sourceLayout, 'processedGametest', delegate)
    }
    tasks.register('processedDriverJar', Jar) {
        archiveClassifier = 'processed-driver'
        from sourceSets.processedGametest.output
    }
    [MaximumNoiseCache: 'maximum-noise-cache', WorldControl: 'world-control', IrisRestart: 'iris-restart',
     Shutdown: 'shutdown', GeneratingShutdown: 'generating-shutdown',
     EarlyStartup: 'early-startup',
     EarlyStartupCold: 'startup-cold', EarlyStartupWarm: 'startup-warm',
     EarlyStartupDamaged: 'startup-damaged'].each { suite, classifier ->
        def suiteMetadata = tasks.register("processed${suite}Metadata") {
            dependsOn tasks.named('processProcessedGametestResources')
            def source = layout.buildDirectory.file('resources/processedGametest/fabric.mod.json')
            def destination = layout.buildDirectory.file("processed${suite}/fabric.mod.json")
            def test = suite.startsWith('EarlyStartup') ? 'EarlyStartup' : suite
            def entrypoint = "com.qb20nh.cbbg.gametest.Release${test}GameTest".toString()
            inputs.file(source)
            inputs.property('entrypoint', entrypoint)
            outputs.file(destination)
            doLast {
                def metadata = new JsonSlurper().parse(source.get().asFile)
                metadata.entrypoints['fabric-client-gametest'] = [entrypoint]
                if (suite.startsWith('EarlyStartup')) {
                    metadata.entrypoints.preLaunch = ['com.qb20nh.cbbg.gametest.ReleaseStartupPreLaunch']
                    metadata.mixins.add('cbbg.early-startup-test.mixins.json')
                }
                destination.get().asFile.parentFile.mkdirs()
                destination.get().asFile.text = groovy.json.JsonOutput.prettyPrint(
                        groovy.json.JsonOutput.toJson(metadata))
            }
        }
        tasks.register("processed${suite}DriverJar", Jar) {
            archiveClassifier = "processed-${classifier}-driver"
            from(sourceSets.processedGametest.output) { exclude 'fabric.mod.json' }
            from(suiteMetadata)
        }
    }
    tasks.register('prepareProcessedRuntime') {
        dependsOn tasks.named('optimizeReleaseJar'), tasks.named('processedDriverJar'),
                tasks.named('checkPackages')
    }
}

tasks.named('jar') {
    destinationDirectory = layout.buildDirectory.dir('intermediates/raw-jar')
    archiveClassifier = 'raw'
    from(new File(repositoryRoot, 'LICENSE'))
    // Source generation is useful before an adapter exists, but an empty adapter
    // must never produce a plausible distribution artifact.
    doFirst {
        if (!sourceSets.main.resources.matching { include 'fabric.mod.json' }.files) {
            throw new GradleException("Adapter metadata is not implemented for ${targetId}")
        }
    }
}

releaseOptimization {
    targetJdk(javaToolchains, target.java as int)
    inputJar.set(tasks.named('jar', Jar).flatMap { it.archiveFile })
    outputJar.set(layout.buildDirectory.file("libs/${base.archivesName.get()}-${project.version}.jar"))
    mappingFile.set(layout.buildDirectory.file("mapping/${base.archivesName.get()}-${project.version}.map"))
    rulesFile.set(new File(repositoryRoot, 'build-config/proguard-release.pro'))
    libraryJars.from(providers.provider {
        def embedded = sharedProjects.collect { it.layout.buildDirectory.get().asFile.canonicalPath + File.separator }
        sourceSets.main.compileClasspath.files.findAll { file ->
            !embedded.any { file.canonicalPath.startsWith(it) }
        }
    })
}
tasks.named('optimizeReleaseJar') { dependsOn tasks.named('jar', Jar) }
if (launchesClient && target.id != artifactOwner.id) {
    gradle.taskGraph.whenReady { graph ->
        if (graph.hasTask(tasks.named('jar').get()) ||
                graph.hasTask(tasks.named('optimizeReleaseJar').get())) {
            throw new GradleException('Use a dedicated invocation for building shared artifacts')
        }
    }
}

tasks.named('processResources') {
    def sharedDescriptor = new File(repositoryRoot, 'src/main/resources/fabric.mod.json')
    inputs.file(sharedDescriptor).withPropertyName('sharedFabricMetadata')
    cbbg.gradle.FabricSources.copyResources(project, repositoryRoot, sourceLayout, 'main', delegate)
    def properties = [version: project.version, minecraft_version: artifactOwner.minecraftDependency ?: artifactOwner.minecraft,
                      loader_version: artifactOwner.dependencies.minimumLoader ?: artifactOwner.dependencies.loader,
                      loader_upper_bound: artifactOwner.dependencies.loaderUpperExclusive ? ' <' + artifactOwner.dependencies.loaderUpperExclusive : '',
                      fabric_api_minimum: artifactOwner.dependencies.minimumFabricApi ?: '*',
                      fabric_api_upper_bound: artifactOwner.dependencies.fabricApiUpperExclusive ? ' <' + artifactOwner.dependencies.fabricApiUpperExclusive : '',
                      java_version: target.java,
                      renderer_family: target.renderer,
                      shader_import: target.renderer == 'blaze-gpu-format' ? '#moj_import' : '#include']
    inputs.properties(properties)
    filesMatching('fabric.mod.json') {
        if (properties.fabric_api_minimum == '*') {
            filter { line -> line.replace('>=${fabric_api_minimum}', '${fabric_api_minimum}') }
        }
        expand(properties)
    }
    doLast {
        cbbg.gradle.FabricBranding.apply(sharedDescriptor, new File(destinationDir, 'fabric.mod.json'))
    }
    if (target.renderer == 'blaze-gpu-format') {
        filesMatching('assets/cbbg/shaders/core/cbbg_dither.fsh') {
            filter { line -> line.replace('#include <', "${properties.shader_import} <") }
        }
    }
}

apply from: new File(repositoryRoot, 'build-config/source-inventory.gradle')
if (target.renderer == 'renderpearl' || usesTextureFormat) {
    apply from: new File(repositoryRoot, 'build-config/fabric-compatibility.gradle')
}

tasks.named('sourcesJar') {
    dependsOn tasks.named('sourceInventory')
}

// Minecraft 26.x uses published names in production; these artifacts need no remap.
// Keep local candidate testing separate from the distribution readiness gate.
def parityCandidateFile = layout.buildDirectory.file(
        "libs/${base.archivesName.get()}-${project.version}-parity-candidate.jar")
def parityCandidateJar = tasks.register('parityCandidateJar') {
    dependsOn tasks.named('optimizeReleaseJar')
    inputs.file(releaseOptimization.outputJar)
    outputs.file(parityCandidateFile)
    doLast {
        def destination = parityCandidateFile.get().asFile
        destination.parentFile.mkdirs()
        java.nio.file.Files.copy(releaseOptimization.outputJar.get().asFile.toPath(),
                destination.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    }
}
def parityDriverJar = tasks.register('parityDriverJar', Jar) {
    archiveClassifier = 'parity-driver'
    from sourceSets.gametest.output
}

// Startup-state and slow maximum-size fixtures run independently of the ordinary suite.
if (target.renderer == 'renderpearl') {
    [earlyStartup: ['EarlyStartupGameTest'],
     irisRestart: ['IrisRestartGameTest'],
     maximumNoiseCache: ['Rgba8ReadbackGameTest', 'MaximumNoiseCacheGameTest'],
     worldPixels: ['Rgba8ReadbackGameTest', 'WorldPixelsGameTest'],
     worldControl: ['Rgba8ReadbackGameTest', 'WorldControlGameTest'],
     debugOverlay: ['Rgba8ReadbackGameTest', 'DebugOverlayGameTest'],
     irisDebug: ['Rgba8ReadbackGameTest', 'IrisGameTest'],
     shaderFailure: ['Rgba8ReadbackGameTest', 'ShaderFailureGameTest', 'PresentationGameTest'],
     dsaBenchmark: ['Rgba8ReadbackGameTest', 'DitherPassGameTest', 'PresentationGameTest',
                    'DsaBenchmarkGameTest']].each { fixture, entrypoints ->
        def fixtureMetadata = tasks.register("${fixture}Metadata") {
            dependsOn tasks.named('processGametestResources')
            def source = layout.buildDirectory.file('resources/gametest/fabric.mod.json')
            def destination = layout.buildDirectory.file("${fixture}/fabric.mod.json")
            inputs.file(source)
            inputs.property('entrypoints', entrypoints)
            outputs.file(destination)
            doLast {
                def metadata = new JsonSlurper().parse(source.get().asFile)
                metadata.entrypoints['fabric-client-gametest'] =
                        entrypoints.collect { "com.qb20nh.cbbg.gametest.${it}".toString() }
                if (fixture == 'earlyStartup') {
                    metadata.entrypoints.remove('preLaunch')
                    metadata.mixins = ['cbbg.early-startup-test.mixins.json']
                }
                if (fixture == 'dsaBenchmark') {
                    metadata.entrypoints.client = ['com.qb20nh.cbbg.gametest.DsaBenchmarkSettings']
                }
                destination.get().asFile.parentFile.mkdirs()
                destination.get().asFile.text = groovy.json.JsonOutput.prettyPrint(
                        groovy.json.JsonOutput.toJson(metadata))
            }
        }
        tasks.register("${fixture}DriverJar", Jar) {
            archiveClassifier = [earlyStartup: 'early-startup-driver',
                                 irisRestart: 'iris-restart-driver',
                                 maximumNoiseCache: 'maximum-noise-cache-driver',
                                 worldPixels: 'world-pixels-driver',
                                 worldControl: 'world-control-driver',
                                 debugOverlay: 'debug-overlay-driver',
                                 irisDebug: 'iris-debug-driver',
                                 shaderFailure: 'shader-failure-driver',
                                 dsaBenchmark: 'dsa-benchmark-driver'][fixture]
            from(sourceSets.gametest.output) { exclude 'fabric.mod.json' }
            from(fixtureMetadata)
        }
    }
}

tasks.named('checkPackages', cbbg.gradle.CheckPackages) {
    dependsOn tasks.named('optimizeReleaseJar')
    artifact.set(releaseOptimization.outputJar)
    mapping.set(releaseOptimization.mappingFile)
    sbom.set(releaseSbomFile)
    sources.set(tasks.named('releaseSourcesJar', Jar).flatMap { it.archiveFile })
    javaVersion.set(target.java as int)
    coreSources.set(new File(repositoryRoot, 'core/src/main/java'))
    doLast {
        def sharedDescriptor = new File(repositoryRoot, 'src/main/resources/fabric.mod.json')
        [tasks.named('jar', Jar).get().archiveFile.get().asFile,
         releaseOptimization.outputJar.get().asFile].each {
            cbbg.gradle.FabricBranding.verify(sharedDescriptor, it)
        }
    }
}
tasks.register('verifyCandidatePackaging') { dependsOn tasks.named('checkPackages') }
tasks.named('check') { dependsOn tasks.named('checkPackages') }
tasks.named('assemble') { dependsOn tasks.named('optimizeReleaseJar') }
tasks.register('prepareParityRuntime') {
    dependsOn parityCandidateJar, parityDriverJar, tasks.named('verifyCandidatePackaging')
}

tasks.register('ciCheck') {
    group = 'verification'
    description = 'Run unit tests and package production and test jars without launching Minecraft.'
    dependsOn tasks.named('check'), project(':core').tasks.named('check'), tasks.named('verifyCandidatePackaging')
    dependsOn tasks.withType(Jar).matching { it.name.endsWith('DriverJar') }
}

ext.candidateTargetId = targetId
apply from: new File(repositoryRoot, 'build-config/candidate-build-outputs.gradle')

tasks.register('dev', Sync) {
    group = 'build'
    description = 'Check and package local development jars without release readiness claims.'
    dependsOn tasks.named('check'), tasks.named('verifyCandidatePackaging')
    into layout.buildDirectory.dir('dev')
    from(tasks.named('jar', Jar).flatMap { it.archiveFile }) {
        rename { "${base.archivesName.get()}-${project.version}-dev.jar" }
    }
    from(tasks.named('sourcesJar').flatMap { it.archiveFile }) {
        rename { "${base.archivesName.get()}-${project.version}-dev-sources.jar" }
    }
}

if (usesTextureFormat) {
    tasks.named('processGametestResources') {
        cbbg.gradle.FabricSources.copyResources(project, repositoryRoot, sourceLayout, 'gametest', delegate)
    }
}
