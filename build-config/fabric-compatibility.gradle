import groovy.json.JsonOutput
import groovy.json.JsonSlurper

// Local packaged-client tests. No launcher or publishing credentials are needed.
def compatibilityRoot = file('../..')
def CandidateFiles = plugins.getPlugin('cbbg.packaging').class.classLoader.loadClass('cbbg.gradle.CandidateFiles')
def TargetCatalog = CandidateFiles.classLoader.loadClass('cbbg.gradle.TargetCatalog')
def CandidateManifest = CandidateFiles.classLoader.loadClass('cbbg.gradle.CandidateManifest')
def FabricCompatibilitySearch = CandidateFiles.classLoader.loadClass('cbbg.gradle.FabricCompatibilitySearch')
def FabricCompatibilityProbe = CandidateFiles.classLoader.loadClass('cbbg.gradle.FabricCompatibilityProbe')
def FabricRuntimeInstallation = CandidateFiles.classLoader.loadClass('cbbg.gradle.FabricRuntimeInstallation')
def compatibilityCatalog = new File(compatibilityRoot, 'targets.json')
def compatibilityTargets = new JsonSlurper().parse(compatibilityCatalog).targets
def compatibilityTarget = compatibilityTargets.find {
    it.id == providers.gradleProperty('target').getOrElse(project.ext.has('candidateTargetId') ?
            project.ext.candidateTargetId : '26.3-fabric')
}
def compatibilityOwner = compatibilityTarget.artifactOf ?
        compatibilityTargets.find { it.id == compatibilityTarget.artifactOf } :
        compatibilityTarget
def sharedArtifactFamily = compatibilityTarget.loader == 'fabric' &&
        compatibilityOwner.compatibleMinecraft
def familyTargets = sharedArtifactFamily ? compatibilityTargets.findAll {
    it.loader == 'fabric' && (it.id == compatibilityOwner.id || it.artifactOf == compatibilityOwner.id)
} : [compatibilityTarget]
def compatibilityOutput = layout.buildDirectory.dir('fabric-compatibility')
def compatibilityReport = compatibilityOutput.map { it.file('minimums.json') }
def compatibilityLastSuccess = compatibilityOutput.map { it.file('last-successful.json') }
def resolvePinnedGametest = { Map target ->
    String version = target.dependencies.clientGametest ?: fabricApi.moduleVersion('fabric-client-gametest-api-v1',
            target.dependencies.fabricApi)
    def configuration = configurations.detachedConfiguration(dependencies.create(
            'net.fabricmc.fabric-api:fabric-client-gametest-api-v1:' + version))
    configuration.transitive = false
    configuration.singleFile
}
def completedFamilySearches = { boolean requireHistoricalDriver ->
    List<String> expected = ([compatibilityOwner.minecraft] + compatibilityOwner.compatibleMinecraft)
            .collect { it + '-fabric' }
    if (familyTargets*.id != expected) {
        throw new GradleException('Shared Fabric dependency search is missing a catalog runtime')
    }
    List<Map> reports = familyTargets.collect { target ->
        File source = new File(compatibilityRoot,
                "build/targets/${target.id}/fabric-compatibility/last-successful.json")
        if (!source.isFile()) throw new GradleException('Missing completed Fabric search for ' + target.id)
        Map found = (Map) CandidateFiles.read(source)
        if (!found.complete || found.target != target.id || found.artifactOwner != compatibilityOwner.id ||
                found.profile != 'none' || found.inputs?.minimumOverrides != true ||
                !found.inputs?.candidate || !found.maximumLoader || !found.maximumFabricApi ||
                !found.minimumLoader || !found.minimumFabricApi ||
                !found.loaderUpperExclusive || !found.fabricApiUpperExclusive) {
            throw new GradleException('Incomplete or mismatched Fabric search for ' + target.id)
        }
        File outputs = new File(compatibilityRoot, "build/targets/${target.id}")
        File driver = new File(compatibilityRoot,
                "build/targets/${compatibilityOwner.id}/libs/${project.base.archivesName.get()}-${project.version}-processed-driver.jar")
        FabricCompatibilitySearch.requireCurrentInputs(found.inputs, driver,
                new File(outputs, 'fabric-compatibility/initial-cbbg.json'),
                resolvePinnedGametest(target), target.dependencies.fabricApi,
                requireHistoricalDriver)
        if (found.results.any { result ->
            result.status in ['failed', 'dependency-rejected'] &&
                    !FabricCompatibilitySearch.before(result.loader, found.minimumLoader) &&
                    !FabricCompatibilitySearch.before(found.maximumLoader, result.loader) &&
                    !FabricCompatibilitySearch.before(result.fabricApi, found.minimumFabricApi) &&
                    !FabricCompatibilitySearch.before(found.maximumFabricApi, result.fabricApi)
        }) {
            throw new GradleException('A tested pair failed inside the proposed range for ' + target.id)
        }
        found
    }
    Map first = reports.first()
    if (reports.any { it.inputs.candidate != first.inputs.candidate ||
            it.inputs.files != first.inputs.files || it.latestLoader != first.latestLoader ||
            it.latestFabricApi != first.latestFabricApi }) {
        throw new GradleException('Fabric runtime searches used different candidate bytes or discovery inputs')
    }
    [reports: reports, bounds: FabricCompatibilitySearch.intersect(reports),
     candidate: first.inputs.candidate, latestLoader: first.latestLoader,
     latestFabricApi: first.latestFabricApi]
}

tasks.register('verifyFabricCompatibility') {
    group = 'verification'
    description = 'Find cached Loader/API compatibility boundaries using the processed release jar.'
    dependsOn 'prepareProcessedRuntime'
    doLast {
        if (System.getenv('CI')?.equalsIgnoreCase('true') || System.getenv('GITHUB_ACTIONS') == 'true') {
            throw new GradleException('Packaged graphics tests require a local test display')
        }
        def required = { String name ->
            if (!providers.gradleProperty(name).isPresent()) {
                throw new GradleException('Missing local test input: -P' + name)
            }
            providers.gradleProperty(name).get()
        }
        File python = file(required('compatibilityPython'))
        File sharedRuntime = file(required('compatibilityRuntime'))
        File java = file(required('compatibilityJava'))
        boolean manageDisplay = providers.gradleProperty('compatibilityManageDisplay').getOrElse('true') == 'true'
        File displayDirectory = manageDisplay ? null : file(required('compatibilityDisplayDirectory'))
        String display = manageDisplay ? null : required('compatibilityWaylandDisplay')
        File eglVendor = providers.gradleProperty('compatibilityEglVendorFile').isPresent() ?
                file(providers.gradleProperty('compatibilityEglVendorFile').get()) : null
        File weston = manageDisplay ? System.getenv('PATH').tokenize(File.pathSeparator)
                .collect { new File(it, 'weston') }.find { it.canExecute() } : null
        if (manageDisplay && weston == null) throw new GradleException('Fresh test displays require Weston')
        String strictOption = providers.gradleProperty('verifyDeclaredMinimums').getOrElse('false')
        if (!(strictOption in ['true', 'false'])) throw new GradleException('verifyDeclaredMinimums must be true or false')
        boolean strict = strictOption == 'true'
        String buildOnlyOption = providers.gradleProperty('verifyBuildDependenciesOnly').getOrElse('false')
        if (!(buildOnlyOption in ['true', 'false'])) {
            throw new GradleException('verifyBuildDependenciesOnly must be true or false')
        }
        boolean buildOnly = buildOnlyOption == 'true'
        boolean familySearch = sharedArtifactFamily && compatibilityTarget.id == compatibilityOwner.id &&
                !strict && !buildOnly
        String profile = providers.gradleProperty('compatibilityProfile').getOrElse('none')
        List<String> profileBackends = compatibilityTarget.compatibilityProfiles[profile]
        if (!profileBackends || (familySearch && familyTargets.any { !it.compatibilityProfiles[profile] })) {
            throw new GradleException('Unknown compatibility profile: ' + profile)
        }
        if (profile != 'none' && !buildOnly) {
            throw new GradleException('Optional compatibility profiles require -PverifyBuildDependenciesOnly=true')
        }
        File output = compatibilityOutput.get().asFile
        output.mkdirs()
        File initialConfig = new File(output, 'initial-cbbg.json')
        String initialSettings = JsonOutput.toJson([strength: 2.0]) + '\n'
        if (!initialConfig.isFile() || initialConfig.text != initialSettings) initialConfig.text = initialSettings
        def readUrl = { String url ->
            URLConnection connection = new URI(url).toURL().openConnection()
            connection.connectTimeout = 30000
            connection.readTimeout = 30000
            connection.getInputStream().withCloseable { it.getText('UTF-8') }
        }
        def run = { List command, File log ->
            FabricCompatibilityProbe.run(command, log, providers, compatibilityRoot)
        }
        Map<String, String> modNames = [modmenu: 'modMenu', clothconfig: 'clothConfig', yacl: 'yacl',
                sodium: 'sodium', iris: 'iris', sulkan: 'sulkan', renderscale: 'renderScale',
                chatpatches: 'chatPatches', immediatelyfast: 'immediatelyFast',
                threatengl: 'threatenGl', forcegl3: 'forceGl3']
        Set<String> selected = profile == 'none' ? [] as Set : profile.tokenize('+') as Set
        if (selected.contains('iris') || selected.contains('sulkan')) selected.add('sodium')
        if (selected.contains('renderscale')) selected.add('clothconfig')
        if (selected.contains('chatpatches')) selected.add('yacl')
        if (selected.any { !modNames.containsKey(it) }) {
            throw new GradleException('Unsupported optional compatibility dependency in ' + profile)
        }
        def sha512 = { File file ->
            java.security.MessageDigest.getInstance('SHA-512').digest(file.bytes).encodeHex().toString()
        }
        Map<String, Map> optionalMods = [:]
        Map effectiveDependencies = TargetCatalog.effectiveDependencies(compatibilityTarget, profile)
        selected.toList().sort().each { String token ->
            String name = modNames[token]
            String pin = effectiveDependencies[name]
            if (!pin) throw new GradleException('Missing catalog dependency pin: ' + name)
            String endpoint = name == 'modMenu' ? 'project/modmenu/version/' + pin : 'version/' + pin
            Map version = (Map) new JsonSlurper().parseText(readUrl('https://api.modrinth.com/v2/' + endpoint))
            if ((name == 'modMenu' ? version.version_number : version.id) != pin ||
                    !version.game_versions?.contains(compatibilityTarget.minecraft) ||
                    !version.loaders?.contains('fabric')) {
                throw new GradleException('Modrinth version does not match the catalog target: ' + name)
            }
            List<Map> primary = version.files?.findAll { it.primary == true && it.filename?.endsWith('.jar') } ?: []
            if (primary.size() != 1 || !(primary[0].hashes?.sha512 ==~ /[0-9a-fA-F]{128}/)) {
                throw new GradleException('Missing primary SHA-512 locked Modrinth jar: ' + name)
            }
            URI url = new URI(primary[0].url as String)
            if (url.scheme != 'https' || url.host != 'cdn.modrinth.com') {
                throw new GradleException('Unexpected Modrinth download URL: ' + name)
            }
            File jar = new File(output, 'optional-mods/' + name + '-' + pin + '.jar')
            jar.parentFile.mkdirs()
            String expected = primary[0].hashes.sha512.toLowerCase(Locale.ROOT)
            if (!jar.isFile() || sha512(jar) != expected) {
                File staged = File.createTempFile(name + '-', '.jar', jar.parentFile)
                try {
                    URLConnection connection = url.toURL().openConnection()
                    connection.connectTimeout = 30000
                    connection.readTimeout = 30000
                    connection.getInputStream().withCloseable { input ->
                        java.nio.file.Files.copy(input, staged.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                    }
                    if (sha512(staged) != expected) throw new GradleException('Modrinth SHA-512 mismatch: ' + name)
                    java.nio.file.Files.move(staged.toPath(), jar.toPath(),
                            java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                } finally {
                    staged.delete()
                }
            }
            optionalMods[name] = [pin: pin, file: jar, sha256: CandidateFiles.sha256(jar), sha512: expected]
        }
        String minecraft = compatibilityTarget.minecraft
        List<String> loaders = new JsonSlurper().parseText(
                readUrl('https://meta.fabricmc.net/v2/versions/loader')).collect { it.version }
                .findAll { it ==~ /\d+\.\d+\.\d+/ }
        String apiMetadata = readUrl('https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml')
        List<String> apiMinecraft = sharedArtifactFamily ?
                [compatibilityOwner.minecraft] + compatibilityOwner.compatibleMinecraft : [minecraft]
        List<String> apis = (apiMetadata =~ /<version>([^<]+)<\/version>/).collect { it[1] }
                .findAll { version -> apiMinecraft.any { version.endsWith('+' + it) } &&
                        version.split('\\+', 2)[0] ==~ /\d+\.\d+\.\d+/ }
        File candidate = releaseOptimization.outputJar.get().asFile
        if (project.version.toString() != CandidateManifest.packageVersion(
                'v' + project.version.toString().split(/\+/, 2)[0], compatibilityOwner)) {
            throw new GradleException('Compatibility search requires the artifact owner package version')
        }
        def driverTask = tasks.named('processedDriverJar', Jar).get()
        def driverArchive = driverTask.hasProperty('runtimeArchiveFile') ? driverTask.runtimeArchiveFile : driverTask.archiveFile
        File driver = driverArchive.get().asFile
        def resolveJar = { String coordinate ->
            def configuration = configurations.detachedConfiguration(dependencies.create(coordinate))
            configuration.transitive = false
            configuration.singleFile
        }
        File gametestJar = resolvePinnedGametest(compatibilityTarget)
        Map fixed = [candidate: CandidateFiles.sha256(candidate), driver: CandidateFiles.sha256(driver),
                target: compatibilityTarget.id, artifactOwner: compatibilityOwner.id,
                gametestApiPin: compatibilityTarget.dependencies.fabricApi,
                gametestApiSha256: CandidateFiles.sha256(gametestJar),
                profile: profile, optionalDependencies: optionalMods.collectEntries { name, mod ->
                    [(name): [pin: mod.pin, sha256: mod.sha256, sha512: mod.sha512]]
                },
                initialConfig: CandidateFiles.sha256(initialConfig),
                display: manageDisplay ? [managed: true] : [directory: displayDirectory.canonicalPath, wayland: display],
                minimumOverrides: !strict, host: System.getProperty('os.name') + '/' +
                        System.getProperty('os.arch') + '/' + System.getProperty('os.version')]
        List<File> identityFiles = [new File(compatibilityRoot, 'build-config/fabric-compatibility.gradle'),
                new File(compatibilityRoot, 'build-config/fabric-startup-tests.gradle'),
                new File(compatibilityRoot, "build-config/${compatibilityOwner.buildProfile}/build.gradle"),
                new File(compatibilityRoot, 'build-logic/src/main/groovy/cbbg/gradle/FabricCompatibilitySearch.groovy'),
                new File(compatibilityRoot, 'build-logic/src/main/groovy/cbbg/gradle/FabricCompatibilityProbe.groovy'),
                python, java, new File(java.parentFile.parentFile, 'release'),
                new File(java.parentFile.parentFile, 'lib/modules'),
                new File(java.parentFile.parentFile, 'lib/server/libjvm.so')]
        File machine = new File('/etc/machine-id')
        if (machine.isFile()) identityFiles.add(machine)
        if (weston != null) identityFiles.add(weston)
        if (eglVendor != null) identityFiles.add(eglVendor)
        File graphics = new File('/sys/class/drm')
        if (graphics.isDirectory()) {
            graphics.listFiles().findAll { it.name ==~ /card\d+/ }.each { card ->
                ['device/vendor', 'device/device', 'device/subsystem_device'].each { name ->
                    File identity = new File(card, name)
                    if (identity.isFile()) identityFiles.add(identity)
                }
            }
        }
        identityFiles.addAll(fileTree(new File(compatibilityRoot, 'scripts')).matching {
            include 'fabric_*.py', 'runtime_catalog.py', 'install_fabric_parity_runtime.py'
        }.files)
        String testSources = compatibilityOwner.buildProfile == 'fabric-upstream' ?
                'adapters/fabric/26.2/src/processedGametest' :
                "renderers/${compatibilityOwner.renderer}/src/processedGametest"
        identityFiles.addAll(fileTree(new File(compatibilityRoot, testSources)).files)
        identityFiles.addAll(fileTree(new File(compatibilityRoot,
                "adapters/fabric/${compatibilityOwner.minecraft}/src/processedGametest")).files)
        identityFiles.addAll(fileTree(new File(compatibilityRoot,
                'adapters/fabric/shared/src/processedGametest')).files)
        identityFiles.addAll(fileTree(new File(compatibilityRoot,
                'renderers/modern/src/gametest/java/com/qb20nh/cbbg/gametest')).matching {
            include 'IrisFixture.java', 'RenderScaleTestAccess.java'
        }.files)
        identityFiles.addAll(fileTree(new File(compatibilityRoot,
                'renderers/renderpearl/src/gametest/java/com/qb20nh/cbbg/gametest/mixin')).matching {
            include 'ScenarioProgressMixin.java'
        }.files)
        identityFiles.addAll(fileTree(new File(compatibilityRoot,
                'core/src/testSupport/java/com/qb20nh/cbbg/reference')).matching {
            include 'DitherReference.java'
        }.files)
        identityFiles.addAll(fileTree(new File(compatibilityRoot,
                'renderers/modern/src/gametest/resources/cbbg-iris-fixture')).files)
        // Driver/native-library changes invalidate graphics results on this machine.
        ['/usr/lib', '/usr/lib64'].each { directory ->
            File libraries = new File(directory)
            if (libraries.isDirectory()) {
                identityFiles.addAll(libraries.listFiles().findAll {
                    it.isFile() && it.name ==~ /lib(GL|EGL|vulkan|nvidia|gallium|drm|wayland|gbm).*\.so.*/
                })
            }
        }
        fixed.files = identityFiles.collectEntries { [(it.canonicalPath): CandidateFiles.sha256(it)] }
        Map<String, File> gametests = [(compatibilityTarget.id): gametestJar]
        Map<String, Map> runtimeInputs = [(compatibilityTarget.id): fixed]
        Map<String, File> runtimeOutputs = [(compatibilityTarget.id): output]
        Map<String, File> runtimeConfigs = [(compatibilityTarget.id): initialConfig]
        if (familySearch) {
            familyTargets.each { target ->
                if (target.id == compatibilityTarget.id) return
                File targetOutput = new File(compatibilityRoot,
                        "build/targets/${target.id}/fabric-compatibility")
                targetOutput.mkdirs()
                File targetConfig = new File(targetOutput, 'initial-cbbg.json')
                if (!targetConfig.isFile() || targetConfig.text != initialSettings) {
                    targetConfig.text = initialSettings
                }
                File targetGametest = resolvePinnedGametest(target)
                gametests[target.id] = targetGametest
                runtimeOutputs[target.id] = targetOutput
                runtimeConfigs[target.id] = targetConfig
                runtimeInputs[target.id] = fixed + [target: target.id,
                        gametestApiPin: target.dependencies.fabricApi,
                        gametestApiSha256: CandidateFiles.sha256(targetGametest),
                        initialConfig: CandidateFiles.sha256(targetConfig)]
            }
        }
        Map runtimes = [:]
        Map apiFiles = [:]
        // Completed local searches provide starting versions, never reusable passes for a new jar.
        def catalogTargets = compatibilityTargets
        def minecraftOrder = { String version ->
            FabricCompatibilitySearch.numbers(version.tokenize('.').size() == 2 ? version + '.0' : version)
                    .collect { it.toString().padLeft(10, '0') }.join('.')
        }
        Set<File> previousReportFiles = fileTree(new File(compatibilityRoot, 'build/targets')).matching {
            include '*/fabric-compatibility/minimums.json', '*/fabric-compatibility/last-successful.json'
        }.files + ['minimums.json', 'last-successful.json'].collect {
            new File(output, it)
        }.findAll { it.isFile() }
        List previousReports = previousReportFiles.collect { source ->
            try {
                Map previous = (Map) CandidateFiles.read(source)
                def target = catalogTargets.find { it.id == previous.target }
                boolean eligible = familySearch ?
                        target?.id in familyTargets*.id && previous.artifactOwner == compatibilityOwner.id :
                        target?.loader == compatibilityTarget.loader &&
                                minecraftOrder(target.minecraft) <= minecraftOrder(minecraft)
                if (previous.complete && previous.minimumLoader && previous.minimumFabricApi && eligible) {
                    return [report: previous, minecraft: minecraftOrder(target.minecraft),
                            updated: source.lastModified()]
                }
            } catch (IOException | GradleException ignored) {
                // An incomplete local record supplies no starting version.
            }
            null
        }.findAll { it != null }.sort { a, b ->
            familySearch ? (b.updated <=> a.updated) :
                    ((b.minecraft <=> a.minecraft) ?: (b.updated <=> a.updated))
        }
        Map previousMinimums = previousReports ? previousReports.first().report : [:]
        List results = []
        Map report = [schemaVersion: 1, target: compatibilityTarget.id, artifactOwner: compatibilityOwner.id,
                profile: profile, inputs: fixed,
                complete: false, policy: 'previous boundaries, exponential bracket, binary search over released SemVer versions',
                upperPolicy: 'first failing release, or next major when the latest release passes',
                latestLoader: FabricCompatibilitySearch.ordered(loaders).last(),
                latestFabricApi: FabricCompatibilitySearch.ordered(apis).last(),
                startingTarget: previousMinimums.target, results: results]
        Map<String, Map> reports = [(compatibilityTarget.id): report]
        if (familySearch) {
            report.sharedSearch = true
            report.boundsScope = 'shared-artifact-family'
            report.familyTargets = familyTargets*.id
            report.policy = 'one shared-artifact family predicate; exponential bracket and binary search over released SemVer versions'
            familyTargets.each { target ->
                if (target.id != compatibilityTarget.id) {
                    reports[target.id] = report.findAll { key, value -> key != 'results' } +
                            [target: target.id, inputs: runtimeInputs[target.id], results: []]
                }
            }
        }
        def save = {
            reports.each { String targetId, Map runtimeReport ->
                File destination = new File(runtimeOutputs[targetId], 'minimums.json')
                String content = JsonOutput.prettyPrint(JsonOutput.toJson(runtimeReport)) + '\n'
                if (!destination.isFile() || destination.text != content) destination.text = content
            }
        }
        save()
        def runtimePairPasses = { Map target, String loaderVersion, String apiVersion ->
            File targetOutput = runtimeOutputs[target.id]
            File targetConfig = runtimeConfigs[target.id]
            File targetGametest = gametests[target.id]
            Map targetFixed = runtimeInputs[target.id]
            Map targetReport = reports[target.id]
            if (!apiFiles.containsKey(apiVersion)) {
                apiFiles[apiVersion] = resolveJar('net.fabricmc.fabric-api:fabric-api:' + apiVersion)
            }
            File api = apiFiles[apiVersion]
            File gametest = targetGametest
            Map apiMetadataEntry = new java.util.zip.ZipFile(api).withCloseable { archive ->
                archive.getInputStream(archive.getEntry('fabric.mod.json')).withCloseable {
                    (Map) new JsonSlurper().parse(it)
                }
            }
            String loaderRequirement = apiMetadataEntry.depends.fabricloader
            if (loaderRequirement ==~ />=\d+\.\d+\.\d+/) {
                String minimum = loaderRequirement.substring(2)
                if (loaderVersion != minimum && FabricCompatibilitySearch.ordered([loaderVersion, minimum])[0] == loaderVersion) {
                    targetReport.results.add([loader: loaderVersion, fabricApi: apiVersion, status: 'dependency-rejected',
                            reason: 'Fabric API requires Loader ' + loaderRequirement,
                            apiSha256: CandidateFiles.sha256(api)])
                    logger.lifecycle("Loader ${loaderVersion}, Fabric API ${apiVersion}: rejected by Fabric API metadata")
                    save()
                    return false
                }
            }
            String runtimeKey = target.id + '/' + loaderVersion
            if (!runtimes.containsKey(runtimeKey)) {
                File runtime = new File(targetOutput, 'runtimes/' + loaderVersion)
                FabricRuntimeInstallation.ensure(runtime, target.id,
                        'fabric-loader-' + loaderVersion + '-' + target.minecraft) { boolean resume ->
                    List command = [python, new File(compatibilityRoot, 'scripts/install_fabric_parity_runtime.py'),
                            '--target', target.id, '--runtime', runtime,
                            '--shared-runtime', sharedRuntime, '--loader-version', loaderVersion]
                    if (resume) command.add('--resume')
                    run(command, new File(targetOutput, 'install-' + loaderVersion + '.log'))
                }
                File lock = new File(runtime, 'cbbg-runtime-lock.json')
                int exit = run([python, new File(compatibilityRoot, 'scripts/fabric_runtime_lock.py'),
                        '--runtime', runtime, '--profile', 'fabric-loader-' + loaderVersion + '-' + target.minecraft,
                        '--lock', lock, '--verify'], new File(targetOutput, 'verify-' + loaderVersion + '.log'))
                if (exit != 0) throw new GradleException('Runtime inputs changed for ' + loaderVersion)
                runtimes[runtimeKey] = [directory: runtime, lock: lock, sha256: CandidateFiles.sha256(lock)]
            }
            Map runtime = runtimes[runtimeKey]
            boolean passes = true
            for (String backend : (List<String>) target.compatibilityProfiles[profile]) {
                Map spec = [root: compatibilityRoot, output: targetOutput,
                        target: target, loaderVersion: loaderVersion, apiVersion: apiVersion,
                        api: api, gametest: gametest, runtime: runtime, optionalMods: optionalMods,
                        candidate: candidate, driver: driver, profile: profile, backend: backend,
                        config: targetConfig, python: python, java: java, strict: strict,
                        manageDisplay: manageDisplay, displayDirectory: displayDirectory,
                        display: display, weston: weston, eglVendor: eglVendor]
                Map inputs = FabricCompatibilityProbe.cacheInputs(targetFixed, spec,
                        new File(compatibilityRoot, 'build-config/fabric-compatibility.gradle'),
                        new File(compatibilityRoot,
                                'build-logic/src/main/groovy/cbbg/gradle/FabricCompatibilitySearch.groovy'))
                Map result = FabricCompatibilitySearch.cached(new File(targetOutput, 'cache'), inputs) {
                    FabricCompatibilityProbe.execute(spec, providers)
                }
                logger.lifecycle("Loader ${loaderVersion}, Fabric API ${apiVersion}, ${backend}: ${result.status}" +
                        (result.cached ? ' (cached)' : ''))
                targetReport.results.add([loader: loaderVersion, fabricApi: apiVersion, backend: backend] + result)
                save()
                if (result.status == 'blocked') throw new GradleException('Dependency test blocked: ' + result.reason)
                passes &= result.status == 'passed'
                if (!passes) break
            }
            passes
        }
        def pairPasses = { String loaderVersion, String apiVersion ->
            FabricCompatibilitySearch.familyPasses(
                    familySearch ? familyTargets : [compatibilityTarget], loaderVersion, apiVersion,
                    runtimePairPasses)
        }
        try {
            Map declared = strict && sharedArtifactFamily ? compatibilityOwner.dependencies : compatibilityTarget.dependencies
            String loader = declared.minimumLoader ?: compatibilityTarget.dependencies.loader
            String api = declared.minimumFabricApi ?: compatibilityTarget.dependencies.fabricApi
            // First establish that each runtime's pinned build dependencies run normally.
            for (Map target : (familySearch ? familyTargets : [compatibilityTarget])) {
                if (!runtimePairPasses(target, target.dependencies.loader, target.dependencies.fabricApi)) {
                    throw new GradleException('Build-time dependency pair failed for ' + target.id)
                }
            }
            if (buildOnly) {
                report.buildDependenciesVerified = true
                return
            }
            if (strict) {
                if (sharedArtifactFamily) {
                    List<String> validApis = FabricCompatibilitySearch.within(apis, api,
                            declared.fabricApiUpperExclusive)
                    if (!validApis) {
                        throw new GradleException('No released Fabric API for this runtime inside shared owner bounds')
                    }
                    api = validApis.first()
                }
                if (!pairPasses(loader, api)) throw new GradleException('Declared minimum dependency pair failed')
                report.declaredMinimumsVerified = true
            } else {
                if (previousMinimums) {
                    loader = FabricCompatibilitySearch.startingVersion(loaders, previousMinimums.minimumLoader)
                    api = FabricCompatibilitySearch.startingVersion(apis, previousMinimums.minimumFabricApi)
                }
                report.startingLoader = loader
                report.startingFabricApi = api
                // Establish a compatible Loader before searching the API's versions.
                loader = FabricCompatibilitySearch.minimum(loaders, loader) {
                    pairPasses(it, compatibilityTarget.dependencies.fabricApi)
                }
                String previous
                do {
                    previous = loader + '/' + api
                    api = FabricCompatibilitySearch.minimum(apis, api) { pairPasses(loader, it) }
                    loader = FabricCompatibilitySearch.minimum(loaders, loader) { pairPasses(it, api) }
                } while (previous != loader + '/' + api)
            }
            report.minimumLoader = loader
            report.minimumFabricApi = api
            Map loaderUpper
            Map apiUpper
            if (strict) {
                if (sharedArtifactFamily) {
                    Map searches = completedFamilySearches(false)
                    if (searches.reports.first().inputs.files != fixed.files) {
                        throw new GradleException('Verification inputs changed; rerun every Fabric runtime search')
                    }
                    if (searches.latestLoader != report.latestLoader ||
                            searches.latestFabricApi != report.latestFabricApi) {
                        throw new GradleException('Dependency releases changed; rerun every Fabric runtime search')
                    }
                    if (declared.minimumLoader != searches.bounds.minimumLoader ||
                            declared.minimumFabricApi != searches.bounds.minimumFabricApi ||
                            declared.loaderUpperExclusive != searches.bounds.loaderUpperExclusive ||
                            declared.fabricApiUpperExclusive != searches.bounds.fabricApiUpperExclusive) {
                        throw new GradleException('Shared owner bounds differ from the completed runtime intersection')
                    }
                    File searchedJar = searches.reports.first().results.findAll {
                        it.status == 'passed' && it.receipt
                    }.collect { result ->
                        new File(new File(result.receipt as String).parentFile, 'mods/candidate.jar')
                    }.find { it.isFile() && CandidateFiles.sha256(it) == searches.candidate }
                    if (searchedJar == null) {
                        throw new GradleException('Missing tested Fabric artifact from the completed search')
                    }
                    FabricCompatibilitySearch.requireSameArtifactExceptBounds(
                            searchedJar, searches.candidate, candidate, declared)
                    List<String> validLoaders = FabricCompatibilitySearch.within(loaders, loader,
                            declared.loaderUpperExclusive)
                    List<String> validApis = FabricCompatibilitySearch.within(apis, api,
                            declared.fabricApiUpperExclusive)
                    if (!validLoaders || !validApis) {
                        throw new GradleException('No released dependency pair inside shared owner bounds')
                    }
                    loaderUpper = [maximum: validLoaders.last(),
                            firstIncompatible: loaders.contains(declared.loaderUpperExclusive) ?
                                    declared.loaderUpperExclusive : null]
                    apiUpper = [maximum: validApis.last(),
                            firstIncompatible: apis.contains(declared.fabricApiUpperExclusive) ?
                                    declared.fabricApiUpperExclusive : null]
                } else {
                    if (!previousMinimums.maximumLoader || !previousMinimums.maximumFabricApi ||
                            previousMinimums.latestLoader != report.latestLoader ||
                            previousMinimums.latestFabricApi != report.latestFabricApi) {
                        throw new GradleException('Dependency releases changed or upper boundaries are missing; rerun the search')
                    }
                    loaderUpper = [maximum: previousMinimums.maximumLoader,
                            firstIncompatible: previousMinimums.incompatibleLoader]
                    apiUpper = [maximum: previousMinimums.maximumFabricApi,
                            firstIncompatible: previousMinimums.incompatibleFabricApi]
                }
                if (declared.loaderUpperExclusive !=
                        FabricCompatibilitySearch.upperLimit(loaderUpper.maximum, loaderUpper.firstIncompatible) ||
                        declared.fabricApiUpperExclusive !=
                        FabricCompatibilitySearch.upperLimit(apiUpper.maximum, apiUpper.firstIncompatible)) {
                    throw new GradleException('Declared upper limits differ from the completed search')
                }
            } else {
                List<String> eligibleLoaders = FabricCompatibilitySearch.ordered(loaders).dropWhile { it != loader }
                List<String> eligibleApis = FabricCompatibilitySearch.ordered(apis)
                        .findAll { !FabricCompatibilitySearch.before(it, api) }
                String upperLoader = FabricCompatibilitySearch.startingVersion(eligibleLoaders,
                        previousMinimums.maximumLoader ?: compatibilityTarget.dependencies.loader)
                String upperApi = FabricCompatibilitySearch.startingVersion(eligibleApis,
                        previousMinimums.maximumFabricApi ?: compatibilityTarget.dependencies.fabricApi)
                loaderUpper = FabricCompatibilitySearch.maximum(eligibleLoaders, upperLoader) {
                    pairPasses(it, compatibilityTarget.dependencies.fabricApi)
                }
                String previous
                Set<String> visited = []
                do {
                    previous = loaderUpper.maximum + '/' + upperApi
                    if (!visited.add(previous)) throw new GradleException('Upper dependency searches did not converge')
                    apiUpper = FabricCompatibilitySearch.maximum(eligibleApis, upperApi) {
                        pairPasses(loaderUpper.maximum, it)
                    }
                    upperApi = apiUpper.maximum
                    loaderUpper = FabricCompatibilitySearch.maximum(eligibleLoaders, loaderUpper.maximum) {
                        pairPasses(it, upperApi)
                    }
                } while (previous != loaderUpper.maximum + '/' + upperApi)
            }
            report.maximumLoader = loaderUpper.maximum
            report.maximumFabricApi = apiUpper.maximum
            report.incompatibleLoader = loaderUpper.firstIncompatible
            report.incompatibleFabricApi = apiUpper.firstIncompatible
            report.loaderUpperExclusive = FabricCompatibilitySearch.upperLimit(loaderUpper.maximum, loaderUpper.firstIncompatible)
            report.fabricApiUpperExclusive = FabricCompatibilitySearch.upperLimit(apiUpper.maximum, apiUpper.firstIncompatible)
            List<String> boundaryApis = FabricCompatibilitySearch.ordered(apis).findAll { candidateApi ->
                [api, apiUpper.maximum].any { boundary ->
                    !FabricCompatibilitySearch.before(candidateApi, boundary) &&
                            !FabricCompatibilitySearch.before(boundary, candidateApi)
                }
            }
            for (String selectedLoader : [loader, loaderUpper.maximum].unique()) {
                for (String selectedApi : boundaryApis) {
                    if (!pairPasses(selectedLoader, selectedApi)) {
                        throw new GradleException('Dependency range contains a failing Loader/API combination: ' +
                                selectedLoader + '/' + selectedApi)
                    }
                }
            }
            if (strict) report.declaredBoundsVerified = true
            reports.each { String targetId, Map runtimeReport ->
                runtimeReport.minimumLoader = report.minimumLoader
                runtimeReport.minimumFabricApi = report.minimumFabricApi
                runtimeReport.maximumLoader = report.maximumLoader
                runtimeReport.maximumFabricApi = report.maximumFabricApi
                runtimeReport.incompatibleLoader = report.incompatibleLoader
                runtimeReport.incompatibleFabricApi = report.incompatibleFabricApi
                runtimeReport.loaderUpperExclusive = report.loaderUpperExclusive
                runtimeReport.fabricApiUpperExclusive = report.fabricApiUpperExclusive
                runtimeReport.startingLoader = report.startingLoader
                runtimeReport.startingFabricApi = report.startingFabricApi
                if (strict) runtimeReport.declaredBoundsVerified = true
                runtimeReport.complete = true
                File success = strict && sharedArtifactFamily ?
                        new File(runtimeOutputs[targetId], 'strict-successful.json') :
                        new File(runtimeOutputs[targetId], 'last-successful.json')
                success.text = JsonOutput.prettyPrint(JsonOutput.toJson(runtimeReport)) + '\n'
            }
        } finally {
            save()
        }
        logger.lifecycle('Tested dependency boundaries: ' + compatibilityReport.get().asFile)
    }
}

tasks.register('updateFabricMinimums') {
    group = 'verification'
    description = 'Write completed dependency-search results into the target catalog.'
    if (!sharedArtifactFamily) dependsOn 'verifyFabricCompatibility'
    doLast {
        Map bounds
        if (sharedArtifactFamily) {
            Map searches = completedFamilySearches(true)
            File candidate = releaseOptimization.outputJar.get().asFile
            if (!candidate.isFile() || CandidateFiles.sha256(candidate) != searches.candidate) {
                throw new GradleException('Shared Fabric searches do not match the current artifact owner jar')
            }
            bounds = searches.bounds
        } else {
            Map report = (Map) CandidateFiles.read(compatibilityReport.get().asFile)
            if (report.target != compatibilityTarget.id || report.artifactOwner != compatibilityOwner.id) {
                throw new GradleException('Dependency search artifact owner changed')
            }
            if (!report.complete) throw new GradleException('Dependency search is incomplete')
            if (!report.maximumLoader || !report.maximumFabricApi) throw new GradleException('Upper boundaries are missing')
            if (report.results.any { result ->
                result.status in ['failed', 'dependency-rejected'] &&
                        !FabricCompatibilitySearch.before(result.loader, report.minimumLoader) &&
                        !FabricCompatibilitySearch.before(report.maximumLoader, result.loader) &&
                        !FabricCompatibilitySearch.before(result.fabricApi, report.minimumFabricApi) &&
                        !FabricCompatibilitySearch.before(report.maximumFabricApi, result.fabricApi)
            }) {
                throw new GradleException('A tested pair failed inside the proposed dependency range')
            }
            bounds = [minimumLoader: report.minimumLoader, minimumFabricApi: report.minimumFabricApi,
                    loaderUpperExclusive: FabricCompatibilitySearch.upperLimit(
                            report.maximumLoader, report.incompatibleLoader),
                    fabricApiUpperExclusive: FabricCompatibilitySearch.upperLimit(
                            report.maximumFabricApi, report.incompatibleFabricApi)]
        }
        String before = compatibilityCatalog.text
        def data = new JsonSlurper().parseText(before)
        Map selected = data.targets.find { it.id == compatibilityOwner.id }
        selected.dependencies.putAll(bounds)
        // Preserve the catalog's compact, one-target-per-line convention.
        List lines = before.readLines()
        int index = lines.findIndexOf { it.contains('"id":"' + compatibilityOwner.id + '"') }
        if (index < 0) throw new GradleException('Cannot locate target catalog row')
        lines[index] = '    ' + JsonOutput.toJson(selected) + (lines[index].trim().endsWith(',') ? ',' : '')
        String after = lines.join('\n') + '\n'
        if (after != before) compatibilityCatalog.text = after
        logger.lifecycle('Updated ' + compatibilityOwner.id + ' dependency bounds; rebuild and test without overrides before release.')
    }
}
