def ReproducibleText = plugins.getPlugin('cbbg.packaging').class.classLoader.loadClass('cbbg.gradle.ReproducibleText')
tasks.register('candidateBuildOutputs') {
    def libraryProduct = project.hasProperty('candidateProduct') && candidateProduct == 'lib'
    dependsOn tasks.named(libraryProduct ? 'check' : 'ciCheck'), tasks.named('sourceInventory')
    dependsOn tasks.named(libraryProduct ? 'prepareLibraryOutputs' : 'prepareBundledLibrary')
    dependsOn tasks.withType(Jar).matching { it.name.endsWith('DriverJar') }
    def destination = layout.file(providers.provider {
        new File(rootProject.file('../..'), "build/${libraryProduct ? 'libraries' : 'targets'}/${candidateTargetId}/candidate-build-outputs.json")
    })
    outputs.file(destination)
    outputs.upToDateWhen { false }
    doLast {
        def root = rootProject.file('../..').canonicalFile.toPath()
        def reference = { File file ->
            def path = file.canonicalFile.toPath()
            if (!path.startsWith(root) || !file.isFile()) {
                throw new GradleException('Missing or invalid candidate output: ' + file.name)
            }
            [path: root.relativize(path).toString().replace('\\', '/'),
             sha256: java.security.MessageDigest.getInstance('SHA-256').digest(file.bytes).encodeHex().toString(),
             filename: file.name]
        }
        def gitOutput = { List<String> arguments ->
            providers.exec {
                workingDir root.toFile()
                commandLine(['git'] + arguments)
            }.standardOutput.asText.get().trim()
        }
        def processed = tasks.names.contains('processedDriverJar')
        def utilitiesSources = utilitiesSourcesArchive
        def utilities = utilitiesArchive
        def drivers = new TreeMap<String, Map>()
        tasks.withType(Jar).matching {
            it.name.endsWith('DriverJar') && it.name.startsWith('processed') == processed
        }.each { driver ->
            def suite = driver.name in ['parityDriverJar', 'processedDriverJar'] ? 'ordinary' :
                    driver.archiveClassifier.get().replaceFirst(/^processed-/, '').replaceFirst(/-driver$/, '')
            if (drivers.containsKey(suite)) throw new GradleException('Duplicate driver suite: ' + suite)
            def archive = driver.hasProperty('runtimeArchiveFile') ? driver.runtimeArchiveFile : driver.archiveFile
            drivers[suite] = reference(archive.get().asFile)
        }
        def output = [schema: 2, product: libraryProduct ? 'lib' : 'cbbg', target: candidateTargetId, version: project.version.toString(),
                      source_commit: gitOutput(['rev-parse', 'HEAD']),
                      source_dirty: !gitOutput(['status', '--porcelain', '--untracked-files=all',
                                               '--', '.', ':(top,exclude)docs/**']).isEmpty(),
                      artifact: reference(releaseOptimization.outputJar.get().asFile),
                      mapping: reference(releaseOptimization.mappingFile.get().asFile),
                      sbom: reference(releaseSbomFile.get().asFile),
                      processing: [tool: 'proguard', version: releaseOptimization.toolVersion],
                      sources: reference(tasks.named('releaseSourcesJar', Jar).get().archiveFile.get().asFile),
                      utilities: reference(utilities), utilities_sources: reference(utilitiesSources),
                      source_inventory: reference(layout.buildDirectory.file('source-inventory.json').get().asFile),
                      drivers: drivers]
        if (!libraryProduct) {
            output.library = reference(libraryArchive)
            output.library_sources = reference(librarySourcesArchive)
            output.library_release = libraryRelease
        }
        destination.get().asFile.parentFile.mkdirs()
        ReproducibleText.writeJson(destination.get().asFile, output)
    }
}
