tasks.named('checkPackages') {
    artifact.set(tasks.named('jar', Jar).flatMap { it.archiveFile })
    sources.set(tasks.named('sourcesJar', Jar).flatMap { it.archiveFile })
    javaVersion.set(25)
    coreSources.set(file('../../core/src/main/java'))
}

tasks.register('ciCheck') {
    group = 'verification'
    dependsOn tasks.named('check'), tasks.named('checkPackages'), project(':core').tasks.named('check')
}
