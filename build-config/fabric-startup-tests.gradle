// Separate launches retain each initial cache state.
['Cold', 'Warm', 'Damaged', 'SeedMismatch'].each { mode ->
    String classifier = 'startup-' + mode.replaceAll(/([a-z])([A-Z])/, '$1-$2').toLowerCase(Locale.ROOT)
    def metadata = tasks.register("processedEarlyStartup${mode}Metadata") {
        dependsOn tasks.named('processProcessedGametestResources')
        def source = layout.buildDirectory.file('resources/processedGametest/fabric.mod.json')
        def destination = layout.buildDirectory.file("processedEarlyStartup${mode}/fabric.mod.json")
        inputs.file(source)
        outputs.file(destination)
        doLast {
            Map descriptor = new groovy.json.JsonSlurper().parse(source.get().asFile)
            descriptor.entrypoints['fabric-client-gametest'] =
                    ['com.qb20nh.cbbg.gametest.ReleaseEarlyStartupGameTest']
            descriptor.entrypoints.preLaunch = ['com.qb20nh.cbbg.gametest.ReleaseStartupPreLaunch']
            descriptor.mixins.add('cbbg.release-startup.mixins.json')
            destination.get().asFile.parentFile.mkdirs()
            destination.get().asFile.text = groovy.json.JsonOutput.prettyPrint(
                    groovy.json.JsonOutput.toJson(descriptor)) + '\n'
        }
    }
    tasks.register("processedEarlyStartup${mode}DriverJar", Jar) {
        archiveClassifier = "processed-${classifier}-driver"
        from(sourceSets.processedGametest.output) { exclude 'fabric.mod.json' }
        from(metadata)
    }
}

[
    Generation: 'ReleaseGenerationGameTest',
    MaximumNoiseCache: 'ReleaseMaximumNoiseCacheGameTest',
    Shutdown: 'ReleaseShutdownGameTest',
    GeneratingShutdown: 'ReleaseGeneratingShutdownGameTest',
    IrisRestart: 'ReleaseIrisRestartGameTest',
    Allocation: 'ReleaseAllocationGameTest',
    WorldPixels: 'ReleaseWorldPixelsGameTest',
    Transparency: 'ReleaseTransparencyGameTest',
    RenderScale: 'ReleaseRenderScaleGameTest',
    ShaderFailure: 'ReleaseShaderFailureGameTest',
    DebugOverlay: 'ReleaseDebugOverlayGameTest',
    Notifications: 'ReleaseNotificationsGameTest'
].each { name, testClass ->
    def metadata = tasks.register("processed${name}Metadata") {
        dependsOn tasks.named('processProcessedGametestResources')
        def source = layout.buildDirectory.file('resources/processedGametest/fabric.mod.json')
        def destination = layout.buildDirectory.file("processed${name}/fabric.mod.json")
        inputs.file(source)
        inputs.property('testClass', testClass)
        outputs.file(destination)
        doLast {
            Map descriptor = new groovy.json.JsonSlurper().parse(source.get().asFile)
            descriptor.entrypoints['fabric-client-gametest'] =
                    ["com.qb20nh.cbbg.gametest.${testClass}".toString()]
            if (name in ['Shutdown', 'GeneratingShutdown']) {
                descriptor.mixins.addAll(['cbbg.release-startup.mixins.json', 'cbbg.release-shutdown.mixins.json'])
            }
            if (name == 'IrisRestart') descriptor.mixins.add('cbbg.release-startup.mixins.json')
            if (name == 'Allocation') descriptor.mixins.add('cbbg.release-allocation.mixins.json')
            destination.get().asFile.parentFile.mkdirs()
            destination.get().asFile.text = groovy.json.JsonOutput.prettyPrint(
                    groovy.json.JsonOutput.toJson(descriptor)) + '\n'
        }
    }
    tasks.register("processed${name}DriverJar", Jar) {
        String suite = name.replaceAll(/([a-z])([A-Z])/, '$1-$2').toLowerCase(Locale.ROOT)
        archiveClassifier = "processed-${suite}-driver"
        from(sourceSets.processedGametest.output) { exclude 'fabric.mod.json' }
        from(metadata)
    }
}
