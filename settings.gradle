pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}

	plugins {
		id("net.fabricmc.fabric-loom") version providers.gradleProperty("loom_version")
	}
}

if (providers.gradleProperty('target').isPresent() || providers.gradleProperty('targets').isPresent()) {
	rootProject.buildFileName = 'dispatch.gradle'
} else {
	include 'core'
}
