// Independent consumer tests compile against the processed library and Minecraft dependencies.
def testTarget = project.libraryTarget
def remapped = project.libraryRemappedGame
def repository = file('../..')
def adapter = testTarget.minecraft == '26.2' ? 'adapters/fabric/26.2' : "renderers/${testTarget.renderer}"
def helpers = [
        'adapters/fabric/shared/src/processedGametest/java/com/qb20nh/cbbg/gametest/ReleaseUtilitiesGameTest.java',
        "${adapter}/src/processedGametest/java/com/qb20nh/cbbg/gametest/UtilitiesBackend.java",
        "${adapter}/src/processedGametest/java/com/qb20nh/cbbg/gametest/ReleaseBackend.java",
        testTarget.renderer == 'gl3' ?
                'renderers/gl3/src/processedGametest/java/com/qb20nh/cbbg/gametest/ReleaseUtilityCalls.java' :
                'adapters/fabric/shared/src/processedGametest/java/com/qb20nh/cbbg/gametest/ReleaseUtilityCalls.java',
        testTarget.minecraft == '1.21.1' ?
                'adapters/minecraft/1.21.1/src/processedGametest/java/com/qb20nh/cbbg/gametest/ReleaseImagePixels.java' :
                'adapters/fabric/shared/src/processedGametest/java/com/qb20nh/cbbg/gametest/ReleaseImagePixels.java',
        testTarget.minecraft == '1.21.1' ?
                'renderers/gl3/src/processedGametest/java/com/qb20nh/cbbg/gametest/mixin/ScenarioProgressMixin.java' :
                'renderers/renderpearl/src/gametest/java/com/qb20nh/cbbg/gametest/mixin/ScenarioProgressMixin.java'
]
dependencies {
    add(remapped ? 'modImplementation' : 'implementation',
            "net.fabricmc.fabric-api:fabric-api:${testTarget.dependencies.fabricApi}")
}
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'cbbg-library-test'
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}
if (testTarget.dependencies.clientGametest) {
    dependencies.add(remapped ? 'modGametestImplementation' : 'gametestImplementation',
            "net.fabricmc.fabric-api:fabric-client-gametest-api-v1:${testTarget.dependencies.clientGametest}")
}
def mappedSources = tasks.register('prepareLibraryConsumerSources', Sync) {
    from(helpers.collect { new File(repository, it) })
    from('src/processedGametest/java')
    into(layout.buildDirectory.dir('generated/library-consumer-sources'))
    filter { String line ->
        String mapped = line.replace('ReleaseClient.checkArtifactAndBackend(context)', 'ReleaseGraphics.check(context)')
        testTarget.minecraft == '1.21.1' ? mapped.replace(
                'net.fabricmc.fabric.api.client.gametest.v1.context.',
                'net.fabricmc.fabric.api.client.gametest.v1.') : mapped
    }
}
def externalClasspath = configurations.compileClasspath.incoming.artifactView {
    componentFilter { it instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier }
}.files + configurations.gametestCompileClasspath.incoming.artifactView {
    componentFilter { it instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier }
}.files
sourceSets.create('processedGametest') {
    java.setSrcDirs([mappedSources])
    resources.setSrcDirs(['src/processedGametest/resources'])
    compileClasspath = files(remapped ? releaseOptimization.optimizedJar : releaseOptimization.outputJar,
            externalClasspath)
    runtimeClasspath = output + compileClasspath
}
tasks.named('compileProcessedGametestJava') { dependsOn tasks.named('optimizeReleaseJar') }
tasks.named('processProcessedGametestResources') {
    inputs.property('loaderMinimum', testTarget.dependencies.minimumLoader ?: testTarget.dependencies.loader)
    inputs.property('minecraftRequirement', testTarget.minecraftDependency ?: testTarget.minecraft)
    inputs.property('javaLevel', testTarget.java)
    filesMatching('cbbg.library-test.mixins.json') { expand(java_level: testTarget.java) }
    filesMatching('fabric.mod.json') {
        expand(loader_minimum: testTarget.dependencies.minimumLoader ?: testTarget.dependencies.loader,
                minecraft_version: testTarget.minecraftDependency ?: testTarget.minecraft)
    }
}
def driver = tasks.register('processedDriverJar', Jar) {
    archiveClassifier = 'processed-driver'
    from sourceSets.processedGametest.output
}
tasks.register('prepareProcessedRuntime') { dependsOn tasks.named('optimizeReleaseJar'), driver }
if (remapped) {
    driver.configure { destinationDirectory = layout.buildDirectory.dir('intermediates/named-drivers') }
    def runtimeDriver = tasks.register('remapProcessedDriverJar', project.fabricRemapTaskType) {
        dependsOn driver
        inputFile.set(driver.flatMap { it.archiveFile })
        archiveFileName.set(driver.flatMap { it.archiveFileName })
        destinationDirectory = layout.buildDirectory.dir('libs')
        addNestedDependencies = false
    }
    driver.configure {
        ext.runtimeArchiveFile = runtimeDriver.flatMap { it.archiveFile }
        finalizedBy runtimeDriver
    }
    tasks.named('prepareProcessedRuntime') { dependsOn runtimeDriver }
    tasks.matching { it.name == 'candidateBuildOutputs' }.configureEach { dependsOn runtimeDriver }
}
