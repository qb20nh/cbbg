import org.cyclonedx.gradle.CyclonedxPlugin
import org.cyclonedx.gradle.CyclonedxDirectTask
import org.cyclonedx.gradle.CyclonedxAggregateTask

initscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'org.cyclonedx:cyclonedx-gradle-plugin:3.4.1'
        classpath platform('com.fasterxml.jackson:jackson-bom:2.22.3')
    }
}

// This init script changes resolution only for security inventories.
def requestedTasks = gradle.startParameter.taskNames
def sbomRun = requestedTasks == ['cyclonedxBom']
def graphRun = requestedTasks == [':ForceDependencyResolutionPlugin_resolveAllDependencies']
if (gradle.parent == null && !sbomRun && !graphRun) {
    throw new GradleException('dependency-sbom.init.gradle requires an inventory task')
}

// Cut Minecraft's library origins, preserving Loom wrappers which also carry
// loader and development dependencies. Shared coordinates requested by CBBG
// remain reachable through their own dependency paths.
def minecraftOrigins = [
    'minecraft', 'minecraftClientLibraries', 'minecraftClientRuntimeLibraries',
    'minecraftServerLibraries', 'minecraftServerRuntimeLibraries', 'minecraftNatives'
] as Set

gradle.projectsEvaluated {
    gradle.rootProject.allprojects { project ->
        if (project.plugins.hasPlugin('net.fabricmc.fabric-loom')) {
            project.configurations.each { configuration ->
                def parents = configuration.extendsFrom
                def retained = parents.findAll { !minecraftOrigins.contains(it.name) }
                if (retained.size() != parents.size()) {
                    configuration.setExtendsFrom(retained)
                }
            }
            if (sbomRun) {
                project.tasks.named('cyclonedxDirectBom', CyclonedxDirectTask) {
                    skipConfigs = minecraftOrigins.toList()
                }
            }
        }
    }
}

if (sbomRun) {
    gradle.rootProject { root ->
        root.pluginManager.apply(CyclonedxPlugin)
        root.allprojects { project ->
            project.tasks.named('cyclonedxDirectBom', CyclonedxDirectTask) {
                includeLicenseText = false
                includeBuildEnvironment = true
                includeConfigs = [
                    'classpath', '.*Classpath', '.*[Aa]nnotationProcessor',
                    'errorprone', 'pmd', 'cpd', 'privateGsonInput', 'include'
                ]
            }
        }
        root.tasks.named('cyclonedxBom', CyclonedxAggregateTask) {
            jsonOutput = root.layout.file(root.providers.provider {
                new File(root.providers.gradleProperty('securitySbom').get())
            })
            xmlOutput.convention((org.gradle.api.file.RegularFile) null)
        }
    }
}
